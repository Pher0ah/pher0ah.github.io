      if(type==="lab"){
        let tid=g("test");
        if(tid==="__new"){
          const nm=g("ntName"); if(!nm) throw new Error("Give the new test a name.");
          tid=nm.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
          S.data.testCatalog[tid]={name:nm,unit:g("ntUnit"),category:g("ntCat")||"Other",decimals:2};
          if(num("ntLo")!=null) S.data.testCatalog[tid].refLow=num("ntLo");
          if(num("ntHi")!=null) S.data.testCatalog[tid].refHigh=num("ntHi");
        }
        if(!g("date")) throw new Error("Date is required.");
        const raw=num("value");
        if(raw==null) throw new Error("Value is required.");
        const uSel=f.elements.unit, factor=uSel?+uSel.value:1;
        const uName=uSel?uSel.options[uSel.selectedIndex].textContent:"";
        const cc=S.data.testCatalog[tid]||{}, dec=cc.decimals!=null?cc.decimals:2;
        const r={date:g("date"),test:tid,
                 value:(factor===1||!isFinite(factor))?raw:+(raw*factor).toFixed(dec)};
        if(factor!==1&&isFinite(factor)) r.orig={value:raw,unit:uName};
        if(g("source")) r.source=g("source");
        if(g("note")) r.note=g("note");
        if(num("refLow")!=null) r.srcRefLow=num("refLow");
        if(num("refHigh")!=null) r.srcRefHigh=num("refHigh");
        S.data.labResults.push(r);
      } else if(type==="vital"){
        if(!g("date")) throw new Error("Date is required.");
        const r={date:g("date")};
        ["time","note"].forEach(k=>{ if(g(k)) r[k]=g(k); });
        ["systolic","diastolic","pulse","weight","spo2","temp","waist","glucose"].forEach(k=>{
          if(num(k)!=null) r[k]=num(k); });
        if(g("medTaken")) r.medTaken=true;
        if(r.systolic&&!r.diastolic) throw new Error("Enter both systolic and diastolic, or neither.");
        if(Object.keys(r).length<2) throw new Error("Enter at least one measurement.");
        r.source="Manual entry";
        (S.data.vitals=S.data.vitals||[]).push(r);
      } else if(type==="med"){
        if(!g("name")) throw new Error("Medication name is required.");
        const r={name:g("name"),status:g("status")||"active"};
        ["generic","cls","dose","freq","start","end","prescriber","note"].forEach(k=>{ if(g(k)) r[k]=g(k); });
        r.id="med"+Date.now();
        (S.data.medications=S.data.medications||[]).push(r);
      } else if(type==="cond"){
        if(!g("name")) throw new Error("Condition name is required.");
        if(!g("onset")) throw new Error("Onset date is required.");
        const r={name:g("name"),onset:g("onset"),status:g("status"),severity:g("severity"),
                 category:g("category")||"Other"};
        if(g("resolved")){ r.resolved=g("resolved"); }
        if(g("note")) r.note=g("note");
        r.id="cond"+Date.now();
        (S.data.conditions=S.data.conditions||[]).push(r);
      } else {
        if(!g("title")) throw new Error("Title is required.");
        const r={date:g("date"),type:g("type"),title:g("title")};
        ["provider","findings","impression"].forEach(k=>{ if(g(k)) r[k]=g(k); });
        (S.data.events=S.data.events||[]).push(r);
      }
    }catch(err){ alert(err.message); return; }
    save(); closeModal(); renderTabs();
    go({lab:"labs",vital:"vitals",med:"meds",cond:"conditions",event:"events"}[type]);
    toast("Record added — remember to Save the file");
  });
}

/* ==================================================================== io */
const DATA_FILE="health-data.json";
let FILE_HANDLE=null;          /* set when the browser hands us a writable handle */

function markDirty(){
  const b=$("#bSave"); if(!b) return;
  b.classList.toggle("dirty",!!S.dirty);
  b.title=S.dirty ? "Unsaved changes \u2014 write them back to "+DATA_FILE
                  : "Save the record to a JSON file";
}
function persist(dirty){
  LS.set(KEY,JSON.stringify(S.data));
  if(dirty!==false) S.dirty=true;
  markDirty();
}
function save(){ persist(true); }

function validRecord(o){
  return o && typeof o==="object" && (o.testCatalog || o.labResults);
}
function applyData(o,label,dirty){
  if(!validRecord(o)) throw new Error("That file does not look like a health record.");
  S.data=o;
  ["labResults","vitals","medications","conditions","events"].forEach(k=>S.data[k]=S.data[k]||[]);
  S.data.testCatalog=S.data.testCatalog||{};
  S.srcLabel=label||"";
  S.dirty=!!dirty;
  persist(!!dirty);
  $("#splash").classList.remove("on");
  boot();
}

/* ---- opening ---------------------------------------------------------- */
function openFile(){
  if(window.showOpenFilePicker){
    window.showOpenFilePicker({types:[{description:"Health record",accept:{"application/json":[".json"]}}]})
      .then(hs=>{ const h=hs[0]; return h.getFile().then(f=>f.text()).then(t=>{
          FILE_HANDLE=h; applyData(JSON.parse(t),f.name,false); toast("Loaded "+f.name); }); })
      .catch(err=>{
        if(err && err.name==="AbortError") return;
        $("#fileIn").click();               /* picker unavailable here \u2014 use the input */
      });
    return;
  }
  $("#fileIn").click();
}
$("#fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ applyData(JSON.parse(r.result),f.name,false); toast("Loaded "+f.name); }
    catch(err){ alert("Could not read that file: "+err.message); } };
  r.readAsText(f); e.target.value="";
});

/* ---- saving ----------------------------------------------------------- */
function afterSave(where){ S.dirty=false; markDirty(); toast("Saved to "+where); }
function exportJSON(){
  const out=JSON.stringify(S.data,null,1);
  if(FILE_HANDLE){
    FILE_HANDLE.createWritable()
      .then(w=>w.write(out).then(()=>w.close()))
      .then(()=>afterSave(FILE_HANDLE.name||DATA_FILE))
      .catch(()=>pickSave(out));
    return;
  }
  pickSave(out);
}
function pickSave(out){
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({suggestedName:DATA_FILE,
        types:[{description:"Health record",accept:{"application/json":[".json"]}}]})
      .then(h=>h.createWritable().then(w=>w.write(out).then(()=>w.close())).then(()=>{
        FILE_HANDLE=h; afterSave(h.name||DATA_FILE); }))
      .catch(e=>{ if(!e||e.name!=="AbortError") dl(out,DATA_FILE); });
    return;
  }
  dl(out,DATA_FILE);
}
function dl(text,name){
  const b=new Blob([text],{type:"application/json"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
  S.dirty=false; markDirty(); toast("Downloaded "+name);
}

$("#bLoad").addEventListener("click",openFile);
$("#eOpen").addEventListener("click",openFile);
$("#bSave").addEventListener("click",exportJSON);
$("#bAdd").addEventListener("click",openAdd);
window.addEventListener("beforeunload",e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=""; } });

/* theme */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(){
  const t=LS.get("hr.theme");
  if(t) document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  const dark=document.documentElement.getAttribute("data-theme")==="dark" ||
    (!t && matchMedia("(prefers-color-scheme:dark)").matches);
  $("#bTheme").innerHTML=dark?SUN:MOON;
}
$("#bTheme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);
  LS.set("hr.theme",dark?"light":"dark");
  applyTheme(); go(S.tab);
});

/* ==================================================================== boot */
function boot(){
  const p=S.data.profile||{};
  $("#pName").textContent=p.name||"Health Record";
  const a=ageAt(p.dob,Date.now());
  $("#pMeta").textContent=[p.sex,a!=null?a+" years":null,p.dob?"DOB "+fmtD(p.dob):null].filter(Boolean).join(" · ");
  const sc=$("#pSrc"); if(sc) sc.textContent=S.srcLabel?("source: "+S.srcLabel):"";
  document.title=(p.name?p.name.split(" ")[0]+" — ":"")+"Health Record";
  renderTabs(); go(S.tab);
}
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(b) go(b.dataset.tab); });
window.addEventListener("resize",()=>{ clearTimeout(window._rz);
  window._rz=setTimeout(()=>{ CHARTS.forEach(f=>f()); },160); });

applyTheme();

/* ==================================================================== startup
   The record lives in health-data.json beside this page. Served over http it is
   fetched automatically; opened straight off the disk the browser forbids that,
   so the last copy kept in this browser is used, or the file is asked for once. */
function showSplash(msg,alt){
  $("#emptyMsg").innerHTML=msg;
  $("#emptyAlt").innerHTML=alt||"";
  $("#splash").classList.add("on");
}
/* The browser copy is a convenience, not the record. Say so, because the file on
   disk may have moved on since it was cached. */
function warnStale(){
  const bar=$("#restoreBar");
  $("#restoreMsg").innerHTML="Showing the copy stored in this browser — "+
    esc(DATA_FILE)+" on disk may be newer.";
  $("#rUse").textContent="Open "+DATA_FILE;
  $("#rDrop").textContent="Dismiss";
  bar.classList.add("on");
  $("#rUse").onclick=()=>{ bar.classList.remove("on"); openFile(); };
  $("#rDrop").onclick=()=>bar.classList.remove("on");
}
function offerRestore(stored){
  const bar=$("#restoreBar");
  $("#restoreMsg").innerHTML="This browser holds a copy with <b>unsaved edits</b> that differs from "+
    esc(DATA_FILE)+".";
  $("#rUse").textContent="Use my edits";
  $("#rDrop").textContent="Discard";
  bar.classList.add("on");
  $("#rUse").onclick=()=>{ bar.classList.remove("on");
    try{ applyData(JSON.parse(stored),"your unsaved working copy",true); toast("Restored your edits \u2014 remember to Save"); }
    catch(e){ alert("That copy could not be read."); } };
  $("#rDrop").onclick=()=>{ bar.classList.remove("on"); LS.set(KEY,JSON.stringify(S.data)); };
}
(function init(){
  const stored=LS.get(KEY);
  /* anything that is not http(s) cannot fetch a sibling file */
  const fromDisk=!/^https?:$/.test(location.protocol);
  fetch(DATA_FILE,{cache:"no-store"})
    .then(r=>r.ok?r.json():Promise.reject(new Error("HTTP "+r.status)))
    .then(j=>{
      applyData(j,DATA_FILE+" (this folder)",false);
      if(stored && stored!==JSON.stringify(j)) offerRestore(stored);
    })
    .catch(()=>{
      if(stored){
        try{
          applyData(JSON.parse(stored),"the copy saved in this browser",false);
          warnStale();
          return;
        }catch(e){}
      }
      showSplash(
        fromDisk
          ? "This page was opened straight from the disk, and browsers do not let a "+
            "<code>file://</code> page read other files on its own. Pick the record once \u2014 "+
            "it is remembered on this device afterwards."
          : "<b>"+esc(DATA_FILE)+"</b> was not found next to this page. Choose it to continue.",
        fromDisk
          ? "<b>To load it automatically instead</b>, serve the folder and open it over http:"+
            "<br><code>python serve.py</code><br>"+
            "That starts a small local server and opens the dashboard, which can then read "+
            "<code>"+esc(DATA_FILE)+"</code> from the folder every time."
          : "");
    });
})();
</script>
</body>
</html>
