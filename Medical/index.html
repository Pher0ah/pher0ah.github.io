  w.addEventListener("click",e=>{const b=e.target.closest("button"); if(b) on(b.dataset.r);});
  return w;
}

/* ---------------------------------------------------------------- summary */
const DEFAULT_KEYTESTS=["hgb","hct","rbc","ldl","hdl","tg","uric_acid","hba1c","creatinine","wbc","alt","crp"];
const EV_BASIS={lab:"Lab results",imaging:"Imaging",pathology:"Pathology",report:"Clinical records","self-reported":"Self-reported"};
const NONE='<div class="none">None recorded</div>';
/* a reading's date and time as one sortable number */
function vTime(r){
  const t=String(r.time||""), h=parseInt(t.slice(0,2),10)||0, m=parseInt(t.slice(3,5),10)||0;
  return (pd(r.date)||0)+(h*3600+m*60)*1000;
}
/* title, sub and link text are fixed strings or counts, never record text */
function sumCard(title,sub,link,body){
  return '<div class="card sum"><div class="sumh"><h3>'+title+'</h3>'+(sub!=null&&sub!==""?'<span class="sub">'+sub+'</span>':'')+
    '<span class="spacer"></span>'+(link?'<button class="lnk" data-go="'+link[1]+'">'+link[0]+'</button>':'')+'</div>'+body+'</div>';
}
function sumTable(heads,rows){
  return '<div class="tbl-wrap"><table class="sumt"><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join("")+
    '</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';
}
/* latest result of a test (numeric only, or any), the numeric result before it, and its flag */
function sumTestRow(id,numOnly){
  const c=cat(id), all=allSeries(id), nums=all.filter(p=>p.v!=null), pool=numOnly?nums:all;
  if(!pool.length) return null;
  const last=pool[pool.length-1];
  const prev=last.v!=null?(nums.length>1?nums[nums.length-2]:null):(nums.length?nums[nums.length-1]:null);
  const r=refOf(last.rec,c);
  return {id:id,c:c,last:last,prev:prev,r:r,f:flagOf(last.v,r.lo,r.hi)};
}
function sumTestTr(d){
  const c=d.c, age=ageTxt(d.last.t);
  const val=d.last.v!=null?fmtVal(d.last.v,c.decimals):esc(d.last.rec.text||"—");
  return '<tr class="clk" data-test="'+esc(d.id)+'"><td>'+esc(c.name)+'</td>'+
    '<td class="num"><b>'+val+'</b> <span class="muted">'+esc(unitTxt(c.unit))+'</span>'+flagChip(d.f)+'</td>'+
    '<td class="num muted">'+esc(refTxt(d.r.lo,d.r.hi,c.decimals))+'</td>'+
    '<td class="num">'+esc(fmtD(d.last.rec.date))+(age?' <span class="acc-warn">'+esc(age)+'</span>':'')+'</td>'+
    '<td class="num muted">'+(d.prev?esc(fmtVal(d.prev.v,c.decimals))+' · '+esc(fmtDS(d.prev.t)):"—")+'</td></tr>';
}
const SUM_TEST_HEADS=["Test","Result","Reference","Date","Previous"];

function vOverview(){
  const v=$("#v-overview"); v.innerHTML=""; clearCharts();
  const D=S.data, ob=x=>x&&typeof x==="object";
  const arr=k=>Array.isArray(D[k])?D[k].filter(ob):[];
  const rk=(list,x)=>{ const i=list.indexOf(x); return i<0?list.length:i; };
  const kv=(k,html)=>'<tr><td class="k">'+k+'</td><td>'+(html||'<span class="muted">not recorded</span>')+'</td></tr>';

  /* 1. problem list */
  const conds=arr("conditions");
  const probs=conds.filter(c=>c.status!=="resolved");
  const onsetK=c=>pd(c.onset)==null?8.64e15:pd(c.onset);
  probs.sort((a,b)=>(rk(["active","monitoring","controlled"],a.status)-rk(["active","monitoring","controlled"],b.status))||
    (rk(["severe","moderate","mild"],a.severity)-rk(["severe","moderate","mild"],b.severity))||(onsetK(a)-onsetK(b)));
  const resN=conds.length-probs.length;
  const since=c=>!c.onset?"—":((isApprox(c.onset,c.onsetApprox)||(c.evidence&&c.evidence.derivedDate))?"~":"")+fmtD(c.onset);
  const basis=c=>{ const k=c.evidence&&c.evidence.kind; if(!k) return "—"; const t=EV_BASIS[k]||k;
    return k==="self-reported"?'<span class="acc-warn">'+esc(t)+'</span>':esc(t); };
  const resLine=resN?'<div class="foot">'+resN+' resolved</div>':"";
  const s1=sumCard("Problem list",probs.length,["All conditions","conditions"],
    (probs.length?sumTable(["Problem","Since","Status","Severity","Basis"],probs.map(c=>
      '<tr><td>'+esc(c.name)+'</td><td class="num">'+esc(since(c))+'</td>'+
      '<td><span class="pill '+(COND_CLS[c.status]||"p-mut")+'">'+esc(c.status||"—")+'</span></td>'+
      '<td>'+(c.severity?'<span class="pill '+(SEV_CLS[c.severity]||"p-mut")+'">'+esc(c.severity)+'</span>':"—")+'</td>'+
      '<td>'+basis(c)+'</td></tr>')):NONE)+resLine);

  /* 2. results outside the reference range (latest value of each test, catalogue order) */
  const have=new Set(testIds());
  const abn=Object.keys(D.testCatalog||{}).filter(id=>have.has(id)).map(id=>sumTestRow(id,true))
    .filter(d=>d&&(d.f==="hi"||d.f==="lo"));
  const s2=sumCard("Results outside the reference range","latest value of each test",["All results","labs"],
    abn.length?sumTable(SUM_TEST_HEADS,abn.map(sumTestTr)):NONE);

  /* 3. key results not already listed above */
  const shown=new Set(abn.map(d=>d.id));
  const keyTests=Array.from(new Set((Array.isArray(D.keyTests)&&D.keyTests.length)?D.keyTests:DEFAULT_KEYTESTS));
  const keyRows=keyTests.filter(id=>!shown.has(id)&&have.has(id)).map(id=>sumTestRow(id,false)).filter(Boolean);
  const s3=keyRows.length?sumCard("Key results",keyRows.length,null,sumTable(SUM_TEST_HEADS,keyRows.map(sumTestTr))):"";

  /* 4. current medication */
  const meds=arr("medications");
  const medCmp=(a,b)=>String(a.cls||"\uffff").localeCompare(String(b.cls||"\uffff"))||
    String(a.generic||a.name||"").localeCompare(String(b.generic||b.name||""));
  const actM=meds.filter(m=>m.status==="active").sort(medCmp), unkM=meds.filter(m=>m.status==="unknown").sort(medCmp);
  const medTr=m=>'<tr><td>'+(m.generic
      ?'<b>'+esc(m.generic)+'</b>'+(m.name&&m.name!==m.generic?' <span class="muted">('+esc(m.name)+')</span>':"")
      :'<b>'+esc(m.name||"—")+'</b>')+(m.status==="unknown"?'<span class="tagw">unconfirmed</span>':"")+'</td>'+
    '<td>'+esc(m.dose||"—")+'</td><td>'+esc(m.freq||"—")+'</td>'+
    '<td class="num">'+(m.start?(isApprox(m.start,m.startApprox)?"~":"")+esc(fmtD(m.start)):"—")+'</td></tr>';
  const s4=sumCard("Current medication",actM.length+" active"+(unkM.length?" · "+unkM.length+" unconfirmed":""),["All medication","meds"],
    (actM.length||unkM.length)?sumTable(["Medicine","Dose","Schedule","Since"],actM.concat(unkM).map(medTr)):NONE);

  /* 5. blood pressure */
  const bp=arr("vitals").filter(r=>r.systolic!=null).sort((a,b)=>vTime(b)-vTime(a));
  let bpBody=NONE;
  if(bp.length){
    const L=bp[0], taken=[]; let looked=0, flagged=0;
    for(let i=0;i<bp.length&&taken.length<30;i++){ looked++; if(bp[i].quality) flagged++; else taken.push(bp[i]); }
    const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
    let avg='<span class="muted">no unflagged readings</span>', pul='—';
    if(taken.length){
      const sys=Math.round(mean(taken.map(r=>+r.systolic)));
      const dd=taken.filter(r=>r.diastolic!=null).map(r=>+r.diastolic), dia=dd.length?Math.round(mean(dd)):null;
      const ct=bpCat(sys,dia==null?0:dia), first=taken[taken.length-1], lastT=taken[0];
      const span=first.date===lastT.date?fmtD(lastT.date):fmtD(first.date)+" – "+fmtD(lastT.date);
      avg='<b class="num">'+sys+(dia!=null?"/"+dia:"")+'</b> <span class="muted">mmHg</span> <span class="pill '+(ct.t==="Normal"?"p-mut":ct.c)+'">'+ct.t+'</span>'+
        '<div class="small muted">n = '+taken.length+' · '+esc(span)+'</div>';
      const pp=taken.filter(r=>r.pulse!=null&&isFinite(+r.pulse)).map(r=>+r.pulse);
      if(pp.length) pul='<b class="num">'+Math.round(mean(pp))+'</b> <span class="muted">bpm</span>';
    }
    bpBody='<table class="sumt kvt"><tbody>'+
      '<tr><td class="k">Latest</td><td><b class="num">'+esc(L.systolic+(L.diastolic!=null?"/"+L.diastolic:""))+'</b> <span class="muted">mmHg</span> · '+
        esc(fmtD(L.date))+(L.time?" "+esc(L.time):"")+(L.source?' <span class="muted">· '+esc(L.source)+'</span>':"")+
        (L.quality?'<span class="tagw">flagged unreliable</span>':"")+'</td></tr>'+
      '<tr><td class="k">Average</td><td>'+avg+'</td></tr>'+
      '<tr><td class="k">Pulse</td><td>'+pul+'</td></tr></tbody></table>'+
      (flagged?'<div class="foot">'+flagged+' of '+looked+' recent readings were flagged unreliable by the device and are left out</div>':"");
  }
  const s5=sumCard("Blood pressure","",["Vitals","vitals"],bpBody);

  /* 6. recent investigations */
  const evs=arr("events").sort((a,b)=>(pd(b.date)||0)-(pd(a.date)||0)).slice(0,4);
  const s6=sumCard("Recent investigations","",["All reports","events"],evs.length?evs.map(e=>
    '<div class="evr"><div class="d num">'+(e.date?(isApprox(e.date,e.dateApprox)?"~":"")+esc(fmtD(e.date)):"—")+'</div><div class="b">'+
      (e.type?'<span class="pill p-mut">'+esc(e.type)+'</span> ':"")+'<b>'+esc(e.title||"—")+'</b>'+
      (e.impression?'<div class="imp">'+esc(e.impression)+'</div>':"")+'</div></div>').join(""):NONE);

  /* 7. history */
  const so=ob(D.socialHistory)?D.socialHistory:{};
  const hist=[
    kv("Allergies",arr("allergies").map(a=>esc(a.substance||"?")+(a.reaction?" — "+esc(a.reaction):"")+(a.severity?" ("+esc(a.severity)+")":"")).join("; ")),
    kv("Family history",arr("familyHistory").map(f=>esc(f.relation||"?")+": "+esc(f.condition||"?")+(f.ageAtOnset!=null&&f.ageAtOnset!==""?" at "+esc(f.ageAtOnset):"")).join("; ")),
    kv("Social history",[["smoking","Smoking"],["alcohol","Alcohol"],["exercise","Exercise"],["occupation","Occupation"]]
      .filter(k=>so[k[0]]!=null&&so[k[0]]!=="").map(k=>k[1]+": "+esc(so[k[0]])).join(" · ")),
    kv("Surgical history",arr("surgicalHistory").map(x=>(x.date?esc(x.date)+" ":"")+esc(x.procedure||"?")).join("; ")),
    kv("Immunisations",arr("immunisations").map(x=>esc(x.vaccine||"?")+(x.date?" "+esc(x.date):"")).join("; "))
  ];
  const s7=sumCard("History","",null,'<table class="sumt kvt"><tbody>'+hist.join("")+'</tbody></table>');

  const grid=document.createElement("div"); grid.className="sumg";
  grid.innerHTML='<div class="sumcol">'+[s1,s2,s3].join("")+'</div><div class="sumcol">'+[s4,s5,s6,s7].join("")+'</div>';
  v.appendChild(grid);

  /* 8. open questions */
  const fu=(Array.isArray(D.followUps)?D.followUps:DEFAULT_FOLLOWUPS).filter(ob);
  if(fu.length){
    const s=document.createElement("div"); s.className="sec";
    s.innerHTML='<div class="sech"><h2>Open questions</h2><span class="sub">notes kept in the record — not a diagnosis</span></div>';
    const g=document.createElement("div"); g.className="grid g-2";
    fu.forEach(f=>{ const d=document.createElement("div"); d.className="note "+esc(f.level||"");
      d.innerHTML='<b>'+esc(f.title)+'</b>'+(f.asOf?' <span class="muted small">· as of '+esc(fmtD(f.asOf))+'</span>':'')+'<br>'+esc(f.text); g.appendChild(d); });
    s.appendChild(g); v.appendChild(s);
  }

  /* 9. trends */
  const s2h=document.createElement("div"); s2h.className="sec";
  const head=document.createElement("div"); head.className="sech";
  head.innerHTML='<h2>Trends</h2><span class="sub">tap a card for the full history</span><span class="spacer"></span>';
  head.appendChild(rangeBar(S.range,r=>{S.range=r; vOverview();}));
  s2h.appendChild(head);
  const g2=document.createElement("div"); g2.className="grid g-tiles";
  keyTests.forEach(id=>{ const c=tickerCard(id,S.range,{h:58,brush:"compact"}); if(c) g2.appendChild(c); });
  s2h.appendChild(g2); v.appendChild(s2h);

  /* 10. footnote */
  const labs=D.labResults||[];
  const dts=labs.map(r=>String(r.date||"")).filter(Boolean).sort();
  const visits=new Set(labs.map(r=>r.date+"|"+(r.source||""))).size;
  const cov=[];
  if(dts.length){ const y0=dts[0].slice(0,4), y1=dts[dts.length-1].slice(0,4);
    cov.push("Record covers "+esc(y0===y1?y0:y0+"–"+y1)+" · "+labs.length+" result"+(labs.length===1?"":"s")+" from "+visits+" visit"+(visits===1?"":"s")); }
  if(D.updated) cov.push("file last saved "+esc(fmtD(D.updated)));
  const foot=document.createElement("div"); foot.className="note small";
  foot.innerHTML="<b>This is a record-keeping tool, not medical advice.</b> Values were consolidated from "+
    "laboratory reports, imaging reports and home measurements. Every result is "+
    "stored in the units used by <b>"+esc(refLabName())+"</b> and flagged against that laboratory's reference "+
    "ranges, so a long-term trend is judged by one yardstick rather than drifting with whichever lab ran the "+
    "sample. Values reported in other units were converted, and both the original number and the reporting "+
    "laboratory's own range are kept with each result — open any test to see them. "+
    (cov.length?"<br><span class='muted'>"+cov.join(" · ")+"</span>":"")+
    (S.srcLabel?"<br><span class='muted'>Loaded from: "+esc(S.srcLabel)+"</span>":"");
  v.appendChild(foot);

  $$("[data-go]",v).forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  $$("tr[data-test]",v).forEach(r=>r.addEventListener("click",()=>openTest(r.dataset.test)));
}
const DEFAULT_FOLLOWUPS=[];  /* clinical prompts live in the record as followUps */


/* ---------------------------------------------------------------- labs */
/* tests in catalogue order (the key order of testCatalog), grouped by category in order of first appearance */
function labOrder(ids){
  const pos=new Map(); Object.keys(S.data.testCatalog||{}).forEach((k,i)=>pos.set(k,i));
  const P=id=>pos.has(id)?pos.get(id):1e9;
  const s=ids.slice().sort((a,b)=>P(a)-P(b));
  const rank=new Map(); s.forEach(i=>{ const g=cat(i).category; if(!rank.has(g)) rank.set(g,rank.size); });
  return s.sort((a,b)=>rank.get(cat(a).category)-rank.get(cat(b).category));
}
const LAB_COLS=[[8,"Last 8"],[16,"Last 16"],[0,"All"]];
function vLabs(){
  const v=$("#v-labs"); v.innerHTML="";
  const ids=labOrder(testIds());
  const cats=Array.from(new Set(ids.map(i=>cat(i).category)));
  const sheet=S.labView!=="trends";

  const bar=document.createElement("div"); bar.className="toolbar";
  const sb=document.createElement("div"); sb.className="searchbar";
  sb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
    '<input type="search" placeholder="Search tests…" value="'+esc(S.labQ)+'">';
  sb.querySelector("input").addEventListener("input",e=>{S.labQ=e.target.value; draw();});
  bar.appendChild(sb);
  const vw=document.createElement("div"); vw.className="ranges";
  vw.innerHTML='<button data-v="sheet"'+(sheet?' class="on"':'')+'>Flowsheet</button><button data-v="trends"'+(sheet?'':' class="on"')+'>Trends</button>';
  vw.addEventListener("click",e=>{const b=e.target.closest("button"); if(b&&b.dataset.v!==(sheet?"sheet":"trends")){ S.labView=b.dataset.v; vLabs(); }});
  bar.appendChild(vw);
  if(sheet){
    const cw=document.createElement("div"); cw.className="ranges";
    cw.innerHTML=LAB_COLS.map(c=>'<button data-n="'+c[0]+'"'+(S.labCols===c[0]?' class="on"':'')+' title="Visits shown as columns">'+c[1]+'</button>').join("");
    cw.addEventListener("click",e=>{const b=e.target.closest("button"); if(b){ S.labCols=+b.dataset.n; vLabs(); }});
    bar.appendChild(cw);
    const ab=document.createElement("button"); ab.className="chip"+(S.labAbn?" on":""); ab.textContent="Abnormal only";
    ab.title="Only tests with a High or Low result in the visits shown"; ab.setAttribute("aria-pressed",S.labAbn?"true":"false");
    ab.addEventListener("click",()=>{ S.labAbn=!S.labAbn; vLabs(); });
    bar.appendChild(ab);
  } else bar.appendChild(rangeBar(S.range,r=>{S.range=r; vLabs();}));
  v.appendChild(bar);

  const chips=document.createElement("div"); chips.className="chips"; chips.style.marginBottom="14px";
  chips.innerHTML='<button class="chip'+(S.labCat==="all"?" on":"")+'" data-c="all">All ('+ids.length+')</button>'+
    cats.map(c=>'<button class="chip'+(S.labCat===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+
      ' ('+ids.filter(i=>cat(i).category===c).length+')</button>').join("");
  chips.addEventListener("click",e=>{const b=e.target.closest(".chip"); if(!b)return; S.labCat=b.dataset.c; vLabs();});
  v.appendChild(chips);

  const out=document.createElement("div"); v.appendChild(out);
  function pick(){
    const q=S.labQ.trim().toLowerCase();
    return ids.filter(i=>(S.labCat==="all"||cat(i).category===S.labCat) &&
      (!q||cat(i).name.toLowerCase().includes(q)||i.toLowerCase().includes(q)));
  }
  function draw(){ clearCharts(); out.innerHTML=""; if(sheet) drawSheet(pick()); else drawTrends(pick()); }

  function drawTrends(ls){
    const hint=document.createElement("div"); hint.className="small muted";
    hint.style.margin="0 0 10px"; hint.textContent="Tap a test to open its history.";
    out.appendChild(hint);
    const list=document.createElement("div"); out.appendChild(list);
    if(!ls.length){ list.innerHTML='<div class="empty">No tests match “'+esc(S.labQ)+'”</div>'; return; }
    let lastCat=null;
    ls.forEach(id=>{
      const c=cat(id);
      if(S.labCat==="all" && c.category!==lastCat){
        lastCat=c.category;
        const h=document.createElement("div"); h.className="sech"; h.style.margin="16px 0 8px";
        h.innerHTML='<h2 style="font-size:13px;color:var(--tx2)">'+esc(c.category)+'</h2>';
        list.appendChild(h);
      }
      const row=accRow(id); if(row) list.appendChild(row);
    });
  }

  /* cumulative results table: tests down the side, visits across the top (newest first) */
  function drawSheet(ls){
    const res=S.data.labResults||[];
    /* one pass: visits, and test -> visit -> result */
    const vis=new Map(), idx={};
    res.forEach(r=>{
      const k=r.date+"|"+(r.source||"");
      if(!vis.has(k)) vis.set(k,{k:k,date:r.date,src:r.source||"",t:pd(r.date)});
      (idx[r.test]||(idx[r.test]={}))[k]=r;
    });
    const all=Array.from(vis.values()).sort((a,b)=>(b.t-a.t)||a.src.localeCompare(b.src));
    const cols=S.labCols>0?all.slice(0,S.labCols):all;
    if(!cols.length){ out.innerHTML='<div class="empty">No lab results recorded yet.</div>'; return; }
    /* cell content and flag for each test over the visible visits */
    let noRes=0; const rows=[];
    ls.forEach(id=>{
      const c=cat(id), row=idx[id]||{}; let any=false, abn=false;
      const cells=cols.map(col=>{
        const r=row[col.k]; if(!r) return {td:'<td></td>'};
        any=true;
        const isN=typeof r.value==="number", f=isN?flagOf(r.value,c.refLow,c.refHigh):"na";
        if(f==="hi"||f==="lo") abn=true;
        const tip=[]; if(r.orig) tip.push("as reported "+r.orig.value+(r.orig.unit?" "+r.orig.unit:""));
        const sr=srcRefOf(r); if(sr) tip.push("lab range "+refTxt(sr.lo,sr.hi,c.decimals));
        const title=tip.length?tip.join(" · "):(r.source||"");
        const body=isN?'<span class="num">'+fmtVal(r.value,c.decimals)+'</span>'+flagChip(f)+(r.text?' <span class="fs-tx">'+esc(r.text)+'</span>':'')
          :'<span class="fs-tx fs-t1">'+esc(r.text||"—")+'</span>';
        return {td:'<td class="'+(f==="hi"?"fs-hi":f==="lo"?"fs-lo":"")+'" title="'+esc(title)+'">'+body+'</td>'};
      });
      if(!any){ noRes++; return; }
      if(S.labAbn && !abn) return;
      rows.push({id:id,c:c,cells:cells});
    });
    if(!rows.length){
      out.innerHTML='<div class="empty">'+(S.labAbn&&noRes<ls.length?'No High or Low results in the visits shown.':
        ls.length?'No results for these tests in the visits shown.':'No tests match “'+esc(S.labQ)+'”')+'</div>';
    } else {
      const info=document.createElement("div"); info.className="small muted"; info.style.margin="0 0 8px";
      info.textContent=rows.length+" test"+(rows.length===1?"":"s")+" · "+cols.length+" visit"+(cols.length===1?"":"s")+
        " shown of "+all.length+" · newest on the left · H / L judged against the "+refLabName()+" range";
      out.appendChild(info);
      let h='<div class="fs-wrap"><table class="fs" style="width:calc(var(--fs0) + '+(cols.length*72)+'px)">'+
        '<colgroup><col class="c0">'+cols.map(()=>'<col class="cv">').join("")+'</colgroup>'+
        '<thead><tr><th class="fs-corner">Test</th>'+cols.map(col=>{
          const s=fmtD(col.date), i=s.lastIndexOf(" ");
          return '<th class="fs-d" title="'+esc(col.src||"")+'">'+esc(i<0?s:s.slice(0,i))+(i<0?"":'<br>'+esc(s.slice(i+1)))+'</th>';
        }).join("")+'</tr></thead><tbody>';
      let last=null;
      rows.forEach(r=>{
        if(r.c.category!==last){ last=r.c.category;
          h+='<tr class="fs-cat"><td colspan="'+(cols.length+1)+'"><span>'+esc(last)+'</span></td></tr>'; }
        const meta=[unitTxt(r.c.unit)].concat((r.c.refLow!=null||r.c.refHigh!=null)?[refTxt(r.c.refLow,r.c.refHigh,r.c.decimals)]:[]).filter(Boolean).join(" · ");
        h+='<tr><td class="fs-n"><span class="fs-nm" data-t="'+esc(r.id)+'" title="Open the history of '+esc(r.c.name)+'">'+esc(r.c.name)+'</span>'+
          (meta?'<small>'+esc(meta)+'</small>':'')+'</td>'+r.cells.map(x=>x.td).join("")+'</tr>';
      });
      const wrap=document.createElement("div"); wrap.innerHTML=h+'</tbody></table></div>';
      const box=wrap.firstChild;
      box.addEventListener("click",e=>{const n=e.target.closest("[data-t]"); if(n) openTest(n.dataset.t);});
      out.appendChild(box);
    }
    if(noRes){
      const m=document.createElement("div"); m.className="small muted"; m.style.margin="8px 0 0";
      m.appendChild(document.createTextNode(noRes+" test"+(noRes===1?" has":"s have")+" no result in these visits"));
      if(S.labCols>0){
        m.appendChild(document.createTextNode(" — "));
        const b=document.createElement("button"); b.className="lnk"; b.textContent="show all visits";
        b.addEventListener("click",()=>{ S.labCols=0; vLabs(); }); m.appendChild(b);
      }
      out.appendChild(m);
    }
  }
  draw();
}

/* one folded row: latest result only, until it is opened */
function accRow(testId){
  const c=cat(testId), all=allSeries(testId);
  if(!all.length) return null;
  const last=all[all.length-1], r=refOf(last.rec,c), f=flagOf(last.v,r.lo,r.hi);
  const prev=all.length>1?all[all.length-2]:null;
  let delta="";
  if(prev&&prev.v!=null&&last.v!=null&&prev.v!==0){
    const d=last.v-prev.v, q=trendQuality(prev.v,last.v,r.lo,r.hi);
    const col=q==="good"?"var(--ok)":q==="bad"?"var(--bad)":"var(--tx3)";
    delta='<span class="tk-d num" style="color:'+col+'" title="change since '+esc(fmtVal(prev.v,c.decimals)+" on "+fmtD(prev.rec.date))+'">'+(d>0?"\u25b2":d<0?"\u25bc":"\u25ac")+
      " "+nf(Math.abs(d),c.decimals)+'</span>';

        '</b><i>'+esc(unitTxt(c.unit))+'</i>'+delta+'</span>'+
      '<span class="pill '+FLAGCLS[f]+'"><i class="dot"></i>'+FLAGTXT[f]+'</span>'+
      '<span class="acc-dt num">'+fmtD(last.rec.date)+(ageTxt(last.t)?' \u00b7 <b style="color:var(--warn)">'+ageTxt(last.t)+'</b>':'')+'</span>'+

/* ---------------------------------------------------------------- vitals */
function bpCat(s,d){
  if(s>180||d>120) return {t:"Hypertensive crisis",c:"p-hi"};
  if(s>=140||d>=90) return {t:"Stage 2",c:"p-hi"};
  if(s>=130||d>=80) return {t:"Stage 1",c:"p-wn"};
  if(s>=120) return {t:"Elevated",c:"p-wn"};
  return {t:"Normal",c:"p-ok"};
}
function vVitals(){
  const v=$("#v-vitals"); v.innerHTML=""; clearCharts();
  const all=(S.data.vitals||[]).slice().sort((a,b)=>
    (pd(a.date)-pd(b.date))||String(a.time||"").localeCompare(String(b.time||"")));
  if(!all.length){ v.innerHTML='<div class="card empty">No vitals recorded yet. Switch on <b>Edit</b>, then use <b>Add</b> to log a blood-pressure reading.</div>'; return; }

  const bar=document.createElement("div"); bar.className="toolbar";
  bar.innerHTML='<h2 style="font-size:16px;margin-right:auto">Blood pressure & vital signs</h2>';
  bar.appendChild(rangeBar(S.vRange,r=>{S.vRange=r; vVitals();}));
  v.appendChild(bar);

  const tOf=r=>pd(r.date)+(r.time?(parseInt(r.time.slice(0,2),10)*3600+parseInt(r.time.slice(3,5),10)*60)*1000:0);
  const bpAll=all.filter(r=>r.systolic!=null);
  const bpWin=windowFor(S.vRange,bpAll.map(r=>({t:tOf(r)})));
  const wFrom=bpWin.from!=null?bpWin.from:-Infinity, wTo=bpWin.to!=null?bpWin.to:Infinity;
  const rows=all.filter(r=>{const t=tOf(r); return t>=wFrom&&t<=wTo;});
  const use=rows.length?rows:all;

  const bp=use.filter(r=>r.systolic!=null);
  const last=bpAll.slice(-1)[0];
  if(bp.length){
    const sysV=bp.map(r=>r.systolic), diaV=bp.map(r=>r.diastolic), pulV=bp.filter(r=>r.pulse!=null).map(r=>r.pulse);
    const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

      ["Latest",last.systolic+"/"+last.diastolic,fmtD(last.date)+(last.time?" "+last.time:"")+" · "+cta.t],

    v.appendChild(st);

    const cb=document.createElement("div"); cb.className="chartbox"; cd.appendChild(cb);

    mountChart(cb,{
      series:[
        {name:"Systolic",points:bpAll.map(r=>({t:tOf(r),v:r.systolic,rec:r})),color:cssv("--bad"),width:2},
        {name:"Diastolic",points:bpAll.map(r=>({t:tOf(r),v:r.diastolic,rec:r})),color:cssv("--acc"),width:2},
        {name:"Pulse",points:bpAll.filter(r=>r.pulse!=null).map(r=>({t:tOf(r),v:r.pulse,rec:r})),color:cssv("--tx3"),width:1.3,dash:[4,3]},
      ],

    const lg=document.createElement("div"); lg.className="legend"; lg.style.margin="-8px 0 18px";
    lg.innerHTML='<span><i style="background:'+cssv("--bad")+'"></i>Systolic</span><span><i style="background:'+cssv("--acc")+'"></i>Diastolic</span>'+
      '<span><i style="background:'+cssv("--tx3")+'"></i>Pulse (bpm)</span><span><i style="background:var(--band);border:1px solid var(--line2)"></i>Target zone 70–130</span>';
    v.appendChild(lg);
  }

  /* other numeric vitals if present */

  const has=extras.filter(e=>all.some(r=>r[e[0]]!=null));

    has.forEach(e=>{
      const allPts=all.filter(r=>r[e[0]]!=null).map(r=>({t:tOf(r),v:+r[e[0]],rec:r}));
      const pts=use.filter(r=>r[e[0]]!=null);

      const card=document.createElement("div"); card.className="card tk";
      card.innerHTML='<div class="tk-h"><div class="tk-n">'+e[1]+'</div></div>'+
        '<div class="tk-v"><b class="num">'+nf(lastv[e[0]],e[3])+'</b><span class="tk-u">'+e[2]+'</span></div>'+
        '<div class="chartbox"></div><div class="tk-f"><span>'+fmtD(lastv.date)+'</span><span>'+pts.length+' readings</span></div>';
      g.appendChild(card);

      mountChart(card.querySelector(".chartbox"),{series:[{name:e[1],points:allPts,color:cssv("--acc"),fill:true}],

        {brush:allPts.length>1?"compact":false});
    });
    s.appendChild(g); v.appendChild(s);
  }

  /* table */
  const s=document.createElement("div"); s.className="sec";
  s.innerHTML='<div class="sech"><h2>Reading log</h2><span class="sub">'+use.length+' entries · newest first</span></div>'+
    '<div class="card tbl-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>BP</th><th>Pulse</th>'+
    '<th>Category</th><th>Note</th><th></th></tr></thead><tbody>'+
    use.slice().reverse().map(r=>{
      const c=r.systolic?bpCat(r.systolic,r.diastolic):null;

      '<td class="small muted">'+(r.quality?'<span class="pill p-wn">'+esc((S.data.qualityCodes&&S.data.qualityCodes[r.quality])||r.quality)+'</span> ':'')+esc(r.note||"")+(r.medTaken?' <span class="pill p-acc">med taken</span>':"")+'</td>'+
      '<td><button class="del" data-del="'+reg(r)+'">×</button></td></tr>';
    }).join("")+'</tbody></table></div>';
  v.appendChild(s);
  $$("[data-del]",s).forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Delete this reading?")) return;
    const o=REG.get(b.dataset.del), i=S.data.vitals.indexOf(o);
    if(i>=0){S.data.vitals.splice(i,1); save(); vVitals(); renderBanner(); toast("Reading deleted");}
  }));
}

/* ---------------------------------------------------------------- timeline */
const CLSCOL={"Antihypertensive":"#ef4444","Lipid-lowering":"#3b82f6","Antiplatelet":"#a855f7",
  "Supplement":"#22c55e","GLP-1 / GIP agonist":"#f59e0b","Other":"#64748b"};
function condColor(c){ return {severe:"#dc2626",moderate:"#f59e0b",mild:"#3b82f6"}[c.severity]||"#64748b"; }
const EV_LABEL={lab:"Laboratory results",imaging:"Imaging report",pathology:"Pathology report",
  report:"Clinical records","self-reported":"Self-reported \u2014 not in any report"};
const EV_ICON={
  lab:'<path d="M9 3v7L4.6 17.4A2 2 0 0 0 6.3 20.5h11.4a2 2 0 0 0 1.7-3.1L15 10V3"/><path d="M8 3h8"/>',
  imaging:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/>',
  pathology:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  report:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  "self-reported":'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'};
/* A condition backed by a lab or an imaging report and one written down from memory
   are not the same kind of fact, so they must not look the same. */
function evidenceBlock(c){
  const e=c.evidence; if(!e) return "";
  const un=e.kind==="self-reported";
  return '<div class="ev'+(un?" unver":"")+'">'+
    '<div class="ev-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
      'stroke-linecap="round" stroke-linejoin="round">'+(EV_ICON[e.kind]||EV_ICON.report)+'</svg>'+
      esc(EV_LABEL[e.kind]||e.kind)+'</div>'+
    esc(e.detail||"")+'</div>';
}
function buildTimeline(items,opt){
  /* items: {label, sub, start, end, ongoing, color, text}
     A missing start, or a missing end on a finished course, is drawn as a faded edge —
     never as a bar running all the way to today. */
  const now=Date.now(), FADE=2*365.25*DAY;
  items.forEach(i=>{
    let a=i.start?pd(i.start):null, b=i.end?pd(i.end):null;
    i._fl=false; i._fr=false;
    if(a==null){ a=(b!=null?b:now)-FADE; i._fl=true; }
    if(b==null){
      if(i.ongoing){ b=now; }
      else { b=Math.min(now,a+FADE); i._fr=true; }
    }
    i._a=a; i._b=Math.max(a+DAY*10,b);
  });
  let t0=Infinity,t1=now;
  items.forEach(i=>{ t0=Math.min(t0,i._a); t1=Math.max(t1,i._b); });
  if(!isFinite(t0)) return document.createTextNode("");
  const y0=new Date(t0).getUTCFullYear(), y1=new Date(t1).getUTCFullYear()+1;
  const T0=Date.UTC(y0,0,1), T1=Date.UTC(y1,0,1);
  const pct=t=>((t-T0)/(T1-T0)*100);
  const years=[]; for(let y=y0;y<=y1;y++) years.push(y);
  const step=years.length>16?5:years.length>9?2:1;

  const wrap=document.createElement("div"); wrap.className="tl-scroll";
  const tl=document.createElement("div"); tl.className="tl";
  tl.style.setProperty("--lbl",(opt&&opt.lbl)||"190px");
  tl.style.setProperty("--gw",(100/years.length)+"%");
  let ax='<div class="tl-axis">';
  years.forEach((y,i)=>{ if(i%step===0) ax+='<span style="left:'+pct(Date.UTC(y,0,1))+'%">'+y+'</span>'; });
  ax+='</div>';
  tl.innerHTML=ax;
  items.forEach(i=>{
    const L=Math.max(0,pct(i._a)), R=Math.min(100,pct(i._b)), C=i.color;
    let bg;
    if(i._fl&&i._fr) bg="linear-gradient(90deg,transparent,"+C+" 32%,"+C+" 68%,transparent)";
    else if(i._fl)   bg="linear-gradient(90deg,transparent,"+C+" 48%,"+C+")";
    else if(i._fr)   bg="linear-gradient(90deg,"+C+","+C+" 52%,transparent)";
    else if(i.ongoing&&!i.end) bg="linear-gradient(90deg,"+C+" 74%,"+C+"55)";
    else bg=C;
    let tip=i.text||"";
    if(i._fl) tip+=" — start date not recorded";
    if(i._fr) tip+=" — end date not recorded";
    const row=document.createElement("div"); row.className="tl-row";
    row.innerHTML='<div class="tl-lbl">'+esc(i.label)+(i.sub?'<small>'+esc(i.sub)+'</small>':'')+'</div>'+
      '<div class="tl-track"><div class="tl-bar" style="left:'+L+'%;width:'+Math.max(0.7,R-L)+'%;background:'+bg+'"'+
      ' title="'+esc(tip)+'">'+esc(i.barText||"")+'</div>'+
      '<div class="tl-today" style="left:'+pct(now)+'%"></div></div>';
    tl.appendChild(row);
  });
  wrap.appendChild(tl);
  return wrap;
}

/* ---------------------------------------------------------------- food IgG */
function vFood(){
  const v=$("#v-food"); v.innerHTML=""; clearCharts();
  const f=S.data.foodIgG;
  if(!f||!f.positives||!f.positives.length){ v.innerHTML='<div class="card empty">No food-sensitivity panel on file.</div>'; return; }
  const BC={high:"#dc2626",mid:"#f59e0b",low:"#3b82f6",ok:"#22c55e"};
  const bandOf=v=> v>=20?"high":v>=10?"mid":v>=5?"low":"ok";
  const bandLbl={high:"Very high",mid:"Moderate",low:"Low",ok:"Negative"};

  v.innerHTML='<div class="sech"><h2>Food-specific IgG panel</h2><span class="sub">'+
    esc(f.method||"")+' · '+fmtD(f.date)+' · '+(f.antigensTested||"?")+' antigens tested</span></div>'+
    '<div class="note warn" style="margin-bottom:16px"><b>Read this first.</b> '+esc(f.disclaimer||"")+'</div>';

  const mx=Math.max.apply(null,f.positives.map(p=>p.value));
  const groups={}; f.positives.forEach(p=>{ (groups[p.group]=groups[p.group]||[]).push(p); });
  const order=Object.keys(groups).sort((a,b)=>
    Math.max.apply(null,groups[b].map(p=>p.value))-Math.max.apply(null,groups[a].map(p=>p.value)));

  const stats=document.createElement("div"); stats.className="grid g-tiles sec";
  const cnt=k=>f.positives.filter(p=>bandOf(p.value)===k).length;
  stats.innerHTML=[
    ["Reactive antigens",f.positives.length,"of "+(f.antigensTested||"?")+" tested"],
    ["Very high (≥20)",cnt("high"),"strongest reactions"],
    ["Moderate (10–19.9)",cnt("mid"),""],
    ["Low (5–9.9)",cnt("low"),""],
  ].map(t=>'<div class="card stat"><div class="l">'+t[0]+'</div><div class="v num">'+esc(t[1])+'</div><div class="s">'+esc(t[2])+'</div></div>').join("");
  v.appendChild(stats);

  order.forEach(gname=>{
    const list=groups[gname].slice().sort((a,b)=>b.value-a.value);
    const s=document.createElement("div"); s.className="sec";
    s.innerHTML='<div class="sech"><h2 style="font-size:14px">'+esc(gname)+'</h2><span class="sub">'+list.length+' reactive</span></div>';
    const card=document.createElement("div"); card.className="card"; card.style.padding="14px";
    const bars=document.createElement("div"); bars.className="bars";
    bars.innerHTML=list.map(p=>{
      const b=bandOf(p.value);
      return '<div class="bar-row"><div class="bar-nm" title="'+esc(p.name)+'">'+esc(p.name)+'</div>'+
      '<div class="bar-tr"><div class="bar-fl" style="width:'+(p.value/mx*100)+'%;background:'+BC[b]+'"></div></div>'+
      '<div class="bar-vl num" style="color:'+BC[b]+'">'+nf(p.value,2)+'</div></div>';
    }).join("");
    card.appendChild(bars); s.appendChild(card); v.appendChild(s);
  });

  const lg=document.createElement("div"); lg.className="legend"; lg.style.marginBottom="14px";
  lg.innerHTML=["high","mid","low"].map(k=>'<span><i style="background:'+BC[k]+'"></i>'+bandLbl[k]+'</span>').join("")+
    '<span>All values in '+esc(f.unit||"µg/mL")+' · below 5 = negative ('+(f.negativeCount||0)+' antigens)</span>';
  v.appendChild(lg);

  if(f.interpretation){
    const guide=document.createElement("div"); guide.className="note";
    guide.innerHTML='<b>Interpretation.</b> '+esc(f.interpretation);
    v.appendChild(guide);
  }
}

        const tid=sel.value;
        const ch=unitChoices(tid, tid==="__new"&&ntU?ntU.value:"");
        uSel.innerHTML=ch.map((u,i)=>'<option value="'+u[1]+'"'+(i?'':' selected')+'>'+esc(u[0])+'</option>').join("");
        showConv();
      }
      function showConv(){
        const tid=sel.value, c=(S.data.testCatalog||{})[tid];
        const f=+uSel.value, raw=parseFloat(vIn.value);
        if(!c){ hint.textContent=""; return; }
        if(f===1||isNaN(f)){
          hint.textContent="Stored as "+(c.unit||"")+" \u2014 the unit used by "+refLabName()+".";
          return;
        }
        const dec=c.decimals!=null?c.decimals:2;
        hint.innerHTML=isNaN(raw)
          ? 'Will be converted to <b>'+esc(c.unit||"")+'</b> before it is stored.'
          : 'Converted: <b>'+nf(raw,4)+' '+esc(uSel.options[uSel.selectedIndex].textContent)+
            '</b> \u2192 <b>'+nf(+(raw*f).toFixed(dec),dec)+' '+esc(c.unit||"")+'</b> (original kept in the record)';
      }
      sel.addEventListener("change",()=>{ $("#newTest",body).style.display = sel.value==="__new"?"block":"none"; fillUnits(); });
      uSel.addEventListener("change",showConv);
      vIn.addEventListener("input",showConv);
      if(ntU) ntU.addEventListener("input",fillUnits);
      fillUnits();
    }
  }
  build();
  const foot=document.createElement("div"); foot.style.display="flex"; foot.style.gap="8px";
  foot.innerHTML='<button class="btn" id="aCancel">Cancel</button><button class="btn pri" id="aSave">Save record</button>';
  showModal("Add a record","Saved into this browser immediately — use Save to write the JSON file",body,foot);
  $("#aCancel").addEventListener("click",closeModal);
  $("#aSave").addEventListener("click",()=>{
    const f=$("#addForm"), g=n=>{ const el=f.elements[n]; return el?(el.type==="checkbox"?el.checked:el.value.trim()):""; };
    const num=n=>{ const s=g(n); return s===""?null:+s; };
    try{
      if(type==="lab"){
        let tid=g("test");
        if(tid==="__new"){
          const nm=g("ntName"); if(!nm) throw new Error("Give the new test a name.");
          tid=nm.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
          S.data.testCatalog[tid]={name:nm,unit:g("ntUnit"),category:g("ntCat")||"Other",decimals:2};
          if(num("ntLo")!=null) S.data.testCatalog[tid].refLow=num("ntLo");
          if(num("ntHi")!=null) S.data.testCatalog[tid].refHigh=num("ntHi");
        }
        if(!g("date")) throw new Error("Date is required.");
        const raw=num("value");
        if(raw==null) throw new Error("Value is required.");
        const uSel=f.elements.unit, factor=uSel?+uSel.value:1;
        const uName=uSel?uSel.options[uSel.selectedIndex].textContent:"";
        const cc=S.data.testCatalog[tid]||{}, dec=cc.decimals!=null?cc.decimals:2;
        const r={date:g("date"),test:tid,
                 value:(factor===1||!isFinite(factor))?raw:+(raw*factor).toFixed(dec)};
        if(factor!==1&&isFinite(factor)) r.orig={value:raw,unit:uName};
        if(g("source")) r.source=g("source");
        if(g("note")) r.note=g("note");
        if(num("refLow")!=null) r.srcRefLow=num("refLow");
        if(num("refHigh")!=null) r.srcRefHigh=num("refHigh");
        S.data.labResults.push(r);
      } else if(type==="vital"){
        if(!g("date")) throw new Error("Date is required.");
        const r={date:g("date")};
        ["time","note","quality"].forEach(k=>{ if(g(k)) r[k]=g(k); });
        ["systolic","diastolic","pulse","weight","spo2","temp","waist","glucose"].forEach(k=>{
          if(num(k)!=null) r[k]=num(k); });
        if(g("medTaken")) r.medTaken=true;
        if(r.systolic&&!r.diastolic) throw new Error("Enter both systolic and diastolic, or neither.");
        if(Object.keys(r).length<2) throw new Error("Enter at least one measurement.");
        r.source="Manual entry";
        (S.data.vitals=S.data.vitals||[]).push(r);
      } else if(type==="med"){
        if(!g("name")) throw new Error("Medication name is required.");
        const r={name:g("name"),status:g("status")||"active"};
        ["generic","cls","dose","freq","start","end","prescriber","note"].forEach(k=>{ if(g(k)) r[k]=g(k); });
        r.id="med"+Date.now();
        (S.data.medications=S.data.medications||[]).push(r);
      } else if(type==="cond"){
        if(!g("name")) throw new Error("Condition name is required.");
        if(!g("onset")) throw new Error("Onset date is required.");
        const r={name:g("name"),onset:g("onset"),status:g("status"),severity:g("severity"),
                 category:g("category")||"Other"};
        if(g("resolved")){ r.resolved=g("resolved"); }
        if(g("note")) r.note=g("note");
        r.id="cond"+Date.now();
        (S.data.conditions=S.data.conditions||[]).push(r);
      } else {
        if(!g("title")) throw new Error("Title is required.");
        const r={date:g("date"),type:g("type"),title:g("title")};
        ["provider","findings","impression"].forEach(k=>{ if(g(k)) r[k]=g(k); });
        (S.data.events=S.data.events||[]).push(r);
      }
    }catch(err){ alert(err.message); return; }
    save(); closeModal(); renderTabs(); renderBanner();
    go({lab:"labs",vital:"vitals",med:"meds",cond:"conditions",event:"events"}[type]);
    toast("Record added — remember to Save the file");
  });
}

/* ==================================================================== io */
const DATA_FILE="health-data.json";
const DIRTY_KEY=KEY+".dirty";
let FILE_HANDLE=null;          /* set when the browser hands us a writable handle */

function markDirty(){
  const b=$("#bSave"); if(!b) return;
  b.classList.toggle("dirty",!!S.dirty);
  b.title=S.dirty ? "Unsaved changes — write them back to "+DATA_FILE
                  : "Save the record to a JSON file";
}
/* The browser copy is the record in its canonical file text, plus a separate flag that
   says whether it holds edits the file does not have yet. */
function persist(dirty){
  if(dirty!==false) S.dirty=true;
  try{
    LS.set(KEY,RecordFormat.toText(S.data));
    LS.set(DIRTY_KEY,S.dirty?"1":"0");
  }catch(e){ console.error(e); }
  markDirty();
}
function save(){ persist(true); }

function validRecord(o){
  return o && typeof o==="object" && (o.testCatalog || o.labResults);
}
/* opts: {warnings, name (file name for the warning bar), keepStored} */
function applyData(o,label,dirty,opts){
  opts=opts||{};
  if(!validRecord(o)) throw new Error("That file does not look like a health record.");
  S.data=o;
  ["labResults","vitals","medications","conditions","events","allergies","familyHistory",
   "surgicalHistory","immunisations"].forEach(k=>S.data[k]=S.data[k]||[]);
  S.data.socialHistory=S.data.socialHistory||{smoking:null,alcohol:null,exercise:null,occupation:null};
  ["testCatalog","devices","qualityCodes","labVisitInfo"].forEach(k=>S.data[k]=S.data[k]||{});
  S.srcLabel=label||"";
  S.dirty=!!dirty;
  if(opts.keepStored) markDirty(); else persist(!!dirty);
  showWarnings(opts.warnings||[],opts.name);
  $("#splash").classList.remove("on");
  boot();
}
function loadText(text,label,dirty,opts){
  const r=RecordFormat.parseText(text);
  applyData(r.data,label,dirty,Object.assign({warnings:r.warnings},opts||{}));
}

/* ---- things to check (warnings never block loading) ------------------------ */
function showWarnings(ws,name){
  const bar=$("#warnBar"), list=$("#warnList");
  if(!ws.length){ bar.classList.remove("on"); return; }
  $("#warnMsg").textContent=ws.length+(ws.length===1?" thing":" things")+" to check in "+(name||DATA_FILE);
  list.innerHTML=ws.slice(0,20).map(w=>"<li>"+esc(w.text)+"</li>").join("")+
    (ws.length>20?"<li>…and "+(ws.length-20)+" more.</li>":"");
  list.style.display="none"; $("#wShow").textContent="Show";
  bar.classList.add("on");
}
$("#wShow").addEventListener("click",()=>{
  const l=$("#warnList"), open=l.style.display==="none";
  l.style.display=open?"block":"none"; $("#wShow").textContent=open?"Hide":"Show";
});
$("#wDrop").addEventListener("click",()=>$("#warnBar").classList.remove("on"));

/* ---- a file that cannot be read ---------------------------------------------
   Never falls back silently to the browser copy: the person is told where the
   mistake is and chooses what to do next. */
function showReadError(err,label,retry){
  $("#splashTitle").textContent="This file could not be read";
  $("#emptyMsg").innerHTML="<b>"+esc(label)+"</b> has a mistake in it, so it was not opened.<br>"+
    "<b>Line "+err.line+", column "+err.col+".</b> "+esc(err.reason);
  const box=$("#errBox");
  box.textContent=err.context+(err.caret?"\n"+err.caret:""); box.style.display="block";
  $("#emptyAlt").innerHTML="Fix the file in a text editor and save it, then press <b>Try again</b>. "+
    "Nothing in the file was changed.";
  const op=$("#eOpen"); op.textContent="Try again"; op.onclick=retry;
  const st=$("#eStored"); st.style.display=LS.get(KEY)?"":"none"; st.onclick=openStored;
  const keep=$("#eKeep"); keep.style.display=S.data?"":"none";
  keep.onclick=()=>$("#splash").classList.remove("on");
  $("#splash").classList.add("on");
}
function openStored(){
  try{
    const r=RecordFormat.parseText(LS.get(KEY));
    applyData(r.data,"the copy saved in this browser",LS.get(DIRTY_KEY)==="1",
      {warnings:r.warnings,name:"the browser copy"});
    warnStale();
  }catch(e){ alert("That copy could not be read: "+e.message); }
}

/* ---- opening ---------------------------------------------------------- */
/* The File System Access API only works on a real http(s) origin. Opened from
   disk it exists but throws, and the rejection arrives too late to fall back to
   the file input, because the click gesture has already expired. So decide
   before calling, and reach the input synchronously. */
function fsApiUsable(){ return /^https?:$/.test(location.protocol); }
function openText(text,name){
  try{ loadText(text,name,false,{name:name}); toast("Loaded "+name); return true; }
  catch(err){
    if(err && err.name==="RecordSyntaxError") showReadError(err,name,openFile);
    else alert("Could not read that file: "+err.message);
    return false;
  }
}
function openFile(){
  if(window.showOpenFilePicker && fsApiUsable()){
    window.showOpenFilePicker({types:[{description:"Health record",accept:{"application/json":[".json"]}}]})
      .then(hs=>{ const h=hs[0];
        return h.getFile().then(f=>f.text().then(t=>({h:h,name:f.name,t:t}))); })
      .then(r=>{ if(openText(r.t,r.name)) FILE_HANDLE=r.h; })
      .catch(err=>{
        if(err && err.name==="AbortError") return;
        $("#fileIn").click();               /* picker unavailable here — use the input */
      });
    return;
  }
  $("#fileIn").click();
}
$("#fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ if(openText(r.result,f.name)) FILE_HANDLE=null; };
  r.readAsText(f); e.target.value="";
});

/* ---- saving ----------------------------------------------------------- */
function afterSave(where){ S.dirty=false; persist(false); toast("Saved to "+where); }
function exportJSON(){
  S.data.updated=todayISO();
  const out=RecordFormat.toText(S.data);
  if(FILE_HANDLE){
    FILE_HANDLE.createWritable()
      .then(w=>w.write(out).then(()=>w.close()))
      .then(()=>afterSave(FILE_HANDLE.name||DATA_FILE))
      .catch(()=>pickSave(out));
    return;
  }
  pickSave(out);
}
function pickSave(out){
  if(window.showSaveFilePicker && fsApiUsable()){
    window.showSaveFilePicker({suggestedName:DATA_FILE,
        types:[{description:"Health record",accept:{"application/json":[".json"]}}]})
      .then(h=>h.createWritable().then(w=>w.write(out).then(()=>w.close())).then(()=>{
        FILE_HANDLE=h; afterSave(h.name||DATA_FILE); }))
      .catch(e=>{ if(!e||e.name!=="AbortError") dl(out,DATA_FILE); });
    return;
  }
  dl(out,DATA_FILE);
}
function dl(text,name){
  const b=new Blob([text],{type:"application/json"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
  S.dirty=false; persist(false); toast("Downloaded "+name);
}

$("#bLoad").addEventListener("click",openFile);
$("#eOpen").onclick=openFile;
$("#bSave").addEventListener("click",exportJSON);
$("#bAdd").addEventListener("click",openAdd);
/* read-only unless switched on: nothing here is stored */
function setEdit(on){
  S.edit=!!on; document.body.classList.toggle("editing",S.edit);
  const b=$("#bEdit"); b.classList.toggle("on",S.edit); b.setAttribute("aria-pressed",S.edit?"true":"false");
  $(".lbl",b).textContent=S.edit?"Done":"Edit";
}
$("#bEdit").addEventListener("click",()=>setEdit(!S.edit));
window.addEventListener("beforeunload",e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=""; } });

/* theme */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(){
  const dark=LS.get("hr.theme")==="dark";
  if(dark) document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  $("#bTheme").innerHTML=dark?SUN:MOON;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",cssv("--bg2")||"#ffffff");
}
$("#bTheme").addEventListener("click",()=>{
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  LS.set("hr.theme",dark?"light":"dark");
  applyTheme(); go(S.tab);
});

/* ==================================================================== boot */
/* patient banner: name, sex, age, DOB; allergies, height, latest weight, BMI, source */
function renderBanner(){
  const p=S.data.profile||{};
  $("#pName").textContent=p.name||"Health Record";
  const a=ageAt(p.dob,Date.now());
  $("#pMeta").textContent=[p.sex,a!=null?a+" years":null,p.dob?"DOB "+fmtD(p.dob):null].filter(Boolean).join(" · ");
  const al=(Array.isArray(S.data.allergies)?S.data.allergies:[]).filter(x=>x&&x.substance);
  const h=+p.height>0?+p.height:null;
  const wr=(Array.isArray(S.data.vitals)?S.data.vitals:[]).filter(r=>r&&+r.weight>0).sort((x,y)=>vTime(y)-vTime(x))[0];
  const w=wr?+wr.weight:null, bits=[];
  if(al.length) al.forEach(x=>bits.push('<span class="alg" title="'+esc([x.reaction,x.severity].filter(Boolean).join(" · "))+'">Allergy: '+esc(x.substance)+'</span>'));
  else bits.push('<span>Allergies: none recorded</span>');
  if(h) bits.push('<span class="pm">Height '+nf(h,1)+' cm</span>');
  if(w!=null) bits.push('<span class="pm" title="'+esc(fmtD(wr.date))+'">Weight '+nf(w,1)+' kg</span>');
  if(h&&w!=null) bits.push('<span class="pm">BMI '+(w/((h/100)*(h/100))).toFixed(1)+'</span>');
  if(S.srcLabel) bits.push('<span class="srcchip pm" id="pSrc">source: '+esc(S.srcLabel)+'</span>');
  $("#pLine2").innerHTML=bits.join("");
}
function boot(){
  const p=S.data.profile||{};
  renderBanner();
  document.title=(p.name?p.name.split(" ")[0]+" — ":"")+"Health Record";
  renderTabs(); go(S.tab);
}
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(b) go(b.dataset.tab); });
window.addEventListener("resize",()=>{ clearTimeout(window._rz);
  window._rz=setTimeout(()=>{ CHARTS.forEach(f=>f()); },160); });

applyTheme();
(function(){
  const h=document.querySelector("header.top");
  const set=()=>document.documentElement.style.setProperty("--hdrH",h.offsetHeight+"px");
  set(); if(window.ResizeObserver) new ResizeObserver(set).observe(h); else window.addEventListener("resize",set);
})();

/* ==================================================================== startup
   The record lives in health-data.json beside this page. Served over http it is
   fetched automatically; opened straight off the disk the browser forbids that,
   so the last copy kept in this browser is used, or the file is asked for once.
   A file with a syntax error is never replaced by the browser copy behind the
   person's back: the error is shown and they choose. */
function showSplash(msg,alt){
  $("#splashTitle").textContent="Open your health record";
  $("#emptyMsg").innerHTML=msg;
  $("#emptyAlt").innerHTML=alt||"";
  $("#errBox").style.display="none";
  const op=$("#eOpen"); op.textContent="Choose "+DATA_FILE; op.onclick=openFile;
  $("#eStored").style.display="none"; $("#eKeep").style.display="none";
  $("#splash").classList.add("on");
}
/* The browser copy is a convenience, not the record. Say so, because the file on
   disk may have moved on since it was cached. */
function warnStale(){
  const bar=$("#restoreBar");
  $("#restoreMsg").innerHTML="Showing the copy stored in this browser — "+
    esc(DATA_FILE)+" on disk may be newer.";
  $("#rUse").textContent="Open "+DATA_FILE;
  $("#rDrop").textContent="Dismiss";
  bar.classList.add("on");
  $("#rUse").onclick=()=>{ bar.classList.remove("on"); openFile(); };
  $("#rDrop").onclick=()=>bar.classList.remove("on");
}
/* Offered only when the browser copy holds edits that were never saved to the file. */
function offerRestore(stored){
  const bar=$("#restoreBar");
  $("#restoreMsg").innerHTML="This browser holds a copy with <b>unsaved edits</b> that differs from "+
    esc(DATA_FILE)+".";
  $("#rUse").textContent="Use my edits";
  $("#rDrop").textContent="Discard";
  bar.classList.add("on");
  $("#rUse").onclick=()=>{ bar.classList.remove("on");
    try{
      const r=RecordFormat.parseText(stored);
      applyData(r.data,"your unsaved working copy",true,{warnings:r.warnings,name:"your working copy"});
      toast("Restored your edits — remember to Save");
    }catch(e){ alert("That copy could not be read."); } };
  $("#rDrop").onclick=()=>{ bar.classList.remove("on"); S.dirty=false; persist(false); };
}
function loadFetched(text){
  const stored=LS.get(KEY), wasDirty=LS.get(DIRTY_KEY)==="1";
  let res;
  try{ res=RecordFormat.parseText(text); }
  catch(err){
    if(err && err.name==="RecordSyntaxError") showReadError(err,DATA_FILE,startup);
    else showSplash("<b>"+esc(DATA_FILE)+"</b> was found but cannot be used: "+esc(err.message)+
      " Choose another file.");
    return;
  }
  try{
    const offer=!!(wasDirty && stored && stored!==RecordFormat.toText(res.data));
    applyData(res.data,DATA_FILE+" (this folder)",false,
      {warnings:res.warnings,name:DATA_FILE,keepStored:offer});
    if(offer) offerRestore(stored);
  }catch(err){
    console.error(err);
    showSplash("Something went wrong while showing the record: "+esc(err.message));
  }
}
function loadFallback(fromDisk){
  const stored=LS.get(KEY);
  if(stored){
    try{
      const r=RecordFormat.parseText(stored);
      applyData(r.data,"the copy saved in this browser",LS.get(DIRTY_KEY)==="1",
        {warnings:r.warnings,name:"the browser copy"});
      warnStale();
      return;
    }catch(e){}
  }
  showSplash(
    fromDisk
      ? "This page was opened straight from the disk, and browsers do not let a "+
        "<code>file://</code> page read other files on its own. Pick the record once — "+
        "it is remembered on this device afterwards."
      : "<b>"+esc(DATA_FILE)+"</b> was not found next to this page. Choose it to continue.",
    fromDisk
      ? "<b>To load it automatically instead</b>, serve the folder and open it over http:"+
        "<br><code>python serve.py</code><br>"+
        "That starts a small local server and opens the dashboard, which can then read "+
        "<code>"+esc(DATA_FILE)+"</code> from the folder every time."
      : "");
}
function startup(){
  /* anything that is not http(s) cannot fetch a sibling file */
  const fromDisk=!/^https?:$/.test(location.protocol);
  fetch(DATA_FILE,{cache:"no-store"})
    .then(r=>r.ok?r.text():Promise.reject(new Error("HTTP "+r.status)))
    .then(loadFetched,()=>loadFallback(fromDisk));
}
startup();
</script>
