<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1220">
<title>Health Record</title>
<style>
/* ============================================================ tokens */
:root{
  --bg:#f4f6fa; --bg2:#ffffff; --panel:#ffffff; --panel2:#f8fafc;
  --line:#e2e8f0; --line2:#cbd5e1;
  --tx:#0f172a; --tx2:#475569; --tx3:#94a3b8;
  --acc:#2563eb; --acc2:#1d4ed8; --accSoft:rgba(37,99,235,.10);
  --ok:#15803d; --okBg:rgba(22,163,74,.12);
  --warn:#b45309; --warnBg:rgba(217,119,6,.14);
  --bad:#dc2626; --badBg:rgba(220,38,38,.12);
  --low:#0369a1; --lowBg:rgba(2,132,199,.12);
  --band:rgba(22,163,74,.10); --grid:rgba(100,116,139,.16);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --r:14px; --rs:10px;
  --safeB:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#0b1220; --bg2:#0f1729; --panel:#131c2f; --panel2:#0f1729;
  --line:#1e2a42; --line2:#2c3a56;
  --tx:#e8eef8; --tx2:#a3b1c9; --tx3:#64748b;
  --acc:#60a5fa; --acc2:#3b82f6; --accSoft:rgba(96,165,250,.14);
  --ok:#4ade80; --okBg:rgba(74,222,128,.14);
  --warn:#fbbf24; --warnBg:rgba(251,191,36,.14);
  --bad:#f87171; --badBg:rgba(248,113,113,.15);
  --low:#38bdf8; --lowBg:rgba(56,189,248,.14);
  --band:rgba(74,222,128,.09); --grid:rgba(148,163,184,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#0b1220; --bg2:#0f1729; --panel:#131c2f; --panel2:#0f1729;
    --line:#1e2a42; --line2:#2c3a56;
    --tx:#e8eef8; --tx2:#a3b1c9; --tx3:#64748b;
    --acc:#60a5fa; --acc2:#3b82f6; --accSoft:rgba(96,165,250,.14);
    --ok:#4ade80; --okBg:rgba(74,222,128,.14);
    --warn:#fbbf24; --warnBg:rgba(251,191,36,.14);
    --bad:#f87171; --badBg:rgba(248,113,113,.15);
    --low:#38bdf8; --lowBg:rgba(56,189,248,.14);
    --band:rgba(74,222,128,.09); --grid:rgba(148,163,184,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--acc)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ============================================================ layout */
.wrap{max-width:1320px;margin:0 auto;padding:0 14px}
header.top{
  position:sticky;top:0;z-index:60;background:var(--bg2);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.topin{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--acc),#0ea5e9);
  display:grid;place-items:center;color:#fff;flex:0 0 auto}
.logo svg{width:19px;height:19px}
.who{min-width:0}
.who b{display:block;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .srcchip{font-size:10.5px;opacity:.85}
.tools{margin-left:auto;display:flex;gap:7px;align-items:center;flex:0 0 auto}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel);color:var(--tx);font-size:13.5px;font-weight:560;
  white-space:nowrap;transition:.14s;
}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2);color:#fff}
.btn.icon{width:38px;padding:0}
.btn svg{width:16px;height:16px;flex:0 0 auto}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:55;background:var(--bg2);border-bottom:1px solid var(--line)}
.tabsin{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabsin::-webkit-scrollbar{display:none}
.tab{
  padding:12px 14px;font-size:14px;font-weight:560;color:var(--tx2);white-space:nowrap;
  border-bottom:2.5px solid transparent;transition:.14s;display:flex;align-items:center;gap:7px
}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab .cnt{font-size:11px;color:var(--tx3);background:var(--panel2);border:1px solid var(--line);
  padding:1px 6px;border-radius:20px}
main{padding:16px 0 40px;min-height:60vh}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============================================================ atoms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin-bottom:20px}
.sech{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sech h2{font-size:16px}
.sech .sub{font-size:12.5px;color:var(--tx3)}
.sech .spacer{flex:1}
.grid{display:grid;gap:12px}
.g-tiles{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.g-charts{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:640;
  padding:2.5px 8px;border-radius:20px;border:1px solid transparent;letter-spacing:.01em}
.p-ok{background:var(--okBg);color:var(--ok)}
.p-hi{background:var(--badBg);color:var(--bad)}
.p-lo{background:var(--lowBg);color:var(--low)}
.p-wn{background:var(--warnBg);color:var(--warn)}
.p-mut{background:var(--panel2);color:var(--tx3);border-color:var(--line)}
.p-acc{background:var(--accSoft);color:var(--acc)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.muted{color:var(--tx3)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

/* range pills */
.ranges{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2.5px;gap:2px}
.ranges button{
  padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:640;color:var(--tx2);
  min-width:42px;transition:.13s
}
.ranges button.on{background:var(--panel);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.12)}
html[data-theme="dark"] .ranges button.on{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .ranges button.on{background:var(--acc);color:#fff}}

/* ============================================================ ticker card */
.tk{padding:13px 14px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.tk:hover{border-color:var(--line2);transform:translateY(-1px)}
.tk:active{transform:scale(.995)}
.tk-h{display:flex;align-items:flex-start;gap:8px}
.tk-n{font-size:12.5px;font-weight:620;color:var(--tx2);line-height:1.3;flex:1;min-width:0}
.tk-v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tk-v b{font-size:27px;font-weight:680;letter-spacing:-.025em;line-height:1}
.tk-u{font-size:11.5px;color:var(--tx3);font-weight:560}
.tk-d{font-size:11.5px;font-weight:640;display:inline-flex;align-items:center;gap:3px}
.tk-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--tx3)}
.spark{width:100%;height:56px;display:block;touch-action:pan-y}
.chartbox{position:relative;width:100%}
.chartbox canvas{width:100%;display:block;touch-action:pan-y}
/* scroll dial */
.brush{position:relative;width:100%;margin-top:7px}
.brush canvas{touch-action:none;cursor:grab;border-radius:8px}
.brush.drag canvas{cursor:grabbing}
.brush-lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:11px;color:var(--tx2);margin-top:5px;flex-wrap:wrap;line-height:1.4}
.brush-lbl b{font-weight:620;font-variant-numeric:tabular-nums}
.zoomer{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:2px;margin-left:auto}
.zoomer button{width:26px;height:22px;border-radius:6px;color:var(--tx2);font-size:14px;
  font-weight:700;line-height:1;display:grid;place-items:center}
.zoomer button:hover{background:var(--panel);color:var(--acc)}
.tip{
  position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);
  border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);z-index:20;
  white-space:nowrap;opacity:0;transition:opacity .1s;transform:translate(-50%,-118%)
}
.tip.on{opacity:1}
.tip b{font-size:13.5px}

/* ============================================================ tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--rs)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  font-weight:660;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--panel)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.tbl-wrap tbody tr:hover{background:var(--panel2)}
.del{color:var(--tx3);font-size:16px;line-height:1;padding:3px 6px;border-radius:6px}
.del:hover{color:var(--bad);background:var(--badBg)}

/* ============================================================ timeline */
.tl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tl{min-width:760px;position:relative}
.tl-axis{position:relative;height:22px;margin-left:var(--lbl);border-bottom:1px solid var(--line)}
.tl-axis span{position:absolute;font-size:10.5px;color:var(--tx3);transform:translateX(-50%);top:4px}
.tl-row{display:flex;align-items:center;gap:0;height:34px;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:none}
.tl-lbl{width:var(--lbl);flex:0 0 var(--lbl);padding-right:12px;font-size:12.5px;font-weight:580;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lbl small{display:block;font-size:10.5px;color:var(--tx3);font-weight:450}
.tl-track{position:relative;flex:1;height:100%}
.tl-track::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px var(--gw))}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:15px;border-radius:8px;
  min-width:5px;display:flex;align-items:center;padding:0 7px;font-size:10px;color:#fff;
  font-weight:640;overflow:hidden;white-space:nowrap}
.tl-bar.now{background-image:linear-gradient(90deg,currentColor 70%,transparent)}
.tl-bar:hover{filter:brightness(1.12);z-index:5}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.55;z-index:4}

/* ============================================================ modal */
.ov{position:fixed;inset:0;background:rgba(8,12,22,.62);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;
  max-width:860px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
  animation:pop .2s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.md-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.md-h h3{font-size:17px;line-height:1.25}
.md-h .sub{font-size:12.5px;color:var(--tx3);margin-top:3px}
.md-b{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.md-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;
  padding-bottom:calc(12px + var(--safeB))}
.x{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  color:var(--tx3);font-size:19px;flex:0 0 auto}
.x:hover{background:var(--panel2);color:var(--tx)}

/* forms */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:620;color:var(--tx2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;height:42px;padding:0 11px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);transition:.14s;font-size:15px
}
.fld textarea{height:auto;min-height:70px;padding:9px 11px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft);background:var(--panel)}
.fld .hint{font-size:11.5px;color:var(--tx3);margin-top:4px}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.seg button{padding:8px 13px;border-radius:9px;border:1px solid var(--line2);font-size:13px;
  font-weight:580;background:var(--panel2);color:var(--tx2)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* first-run splash + unsaved marker */
.splash{display:none;position:fixed;inset:0;background:var(--bg);z-index:90;
  align-items:center;justify-content:center;padding:20px}
.splash.on{display:flex}
.splash-card{max-width:540px;width:100%;padding:32px 26px;text-align:center}
.splash-ic{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;
  margin:0 auto 17px;color:#fff;background:linear-gradient(145deg,var(--acc),#0ea5e9)}
.splash-ic svg{width:30px;height:30px}
.splash-card h2{font-size:19px;margin-bottom:10px}
.splash-card p{font-size:13.5px;line-height:1.65;margin:0 0 20px;color:var(--tx2)}
.splash-alt{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--tx3);line-height:1.7;text-align:left}
.splash-alt code{background:var(--panel2);border:1px solid var(--line);padding:2px 7px;
  border-radius:5px;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.btn.dirty{border-color:var(--warn);color:var(--warn)}
.btn.dirty::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.bar{display:none;background:var(--warnBg);border-bottom:1px solid var(--line)}
.bar.on{display:block}
.bar .in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;font-size:13px}
.bar .in span{flex:1;min-width:200px}
.srcchip{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(78px + var(--safeB));transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:560;
  z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* misc */
.searchbar{position:relative;flex:1;min-width:180px}
.searchbar input{width:100%;height:38px;padding:0 12px 0 34px;border-radius:10px;
  border:1px solid var(--line2);background:var(--panel);font-size:14px}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--tx3)}
.searchbar input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line2);font-size:12.5px;
  font-weight:560;color:var(--tx2);white-space:nowrap;background:var(--panel)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{padding:36px 20px;text-align:center;color:var(--tx3);font-size:14px}
.kv{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv b{flex:0 0 118px;font-weight:580;color:var(--tx2)}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:var(--rs);padding:11px 13px;font-size:13px;color:var(--tx2);line-height:1.55}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px}
.bar-nm{flex:0 0 44%;max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tr{flex:1;height:16px;background:var(--panel2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar-fl{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar-vl{flex:0 0 54px;text-align:right;font-weight:640;font-size:12.5px}
.evt{padding:14px;display:flex;gap:13px}
.evt-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--accSoft);color:var(--acc)}
.evt-ic svg{width:18px;height:18px}
.stat{padding:12px 14px}
.stat .l{font-size:11.5px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:680;letter-spacing:-.02em;margin-top:3px}
.stat .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx3);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* mobile */
@media (max-width:720px){
  .wrap{padding:0 11px}
  .g-tiles{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
  .g-charts{grid-template-columns:1fr}
  .tk-v b{font-size:23px}
  .who span{display:none}
  .btn span.lbl{display:none}
  .btn{padding:0 11px}
  main{padding-bottom:calc(84px + var(--safeB))}
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;top:auto;border-top:1px solid var(--line);border-bottom:none;
    padding-bottom:var(--safeB);z-index:70;box-shadow:0 -4px 20px -8px rgba(0,0,0,.25)
  }
  .tabsin{justify-content:space-between}
  .tab{flex-direction:column;gap:3px;font-size:10px;padding:8px 4px;flex:1;justify-content:center;
    border-bottom:none;border-top:2.5px solid transparent}
  .tab.on{border-top-color:var(--acc)}
  .tab svg{width:20px;height:20px}
  .tab .cnt{display:none}
  .ov{padding:0;align-items:flex-end}
  .md{max-width:100%;max-height:94vh;border-radius:20px 20px 0 0;animation:up .24s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .kv b{flex:0 0 96px}
  .bar-nm{flex:0 0 46%;max-width:46%;font-size:12.5px}
  table{font-size:12.5px}
  th,td{padding:8px 8px}
}
@media (min-width:721px){ .tab svg{display:none} }
</style>
</head>
<body>

<header class="top"><div class="wrap"><div class="topin">
  <div class="brand">

<script>
"use strict";
/* ==================================================================== utils */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY=864e5;
function pd(s){ if(!s) return null; const p=String(s).split("-"); return Date.UTC(+p[0],(+p[1]||1)-1,+p[2]||1); }
function fmtT(t){ const d=new Date(t); return d.getUTCDate()+" "+MON[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function fmtD(s){ return s?fmtT(pd(s)):"—"; }
function fmtDS(t){ const d=new Date(t); return MON[d.getUTCMonth()]+" "+String(d.getUTCFullYear()).slice(2); }
function nf(v,d){ if(v==null||isNaN(v)) return "—"; return Number(v).toFixed(d==null?2:d).replace(/\.0+$|(\.\d*?)0+$/,"$1"); }
function ageAt(dob,t){ if(!dob) return null; const b=new Date(pd(dob)),n=new Date(t||Date.now());
  let a=n.getUTCFullYear()-b.getUTCFullYear(); const m=n.getUTCMonth()-b.getUTCMonth();
  if(m<0||(m===0&&n.getUTCDate()<b.getUTCDate())) a--; return a; }
function yrsBetween(a,b){ return ((b-a)/(365.25*DAY)); }
function durTxt(a,b){ const y=yrsBetween(a,b); if(y>=1.5) return Math.round(y)+" yrs";
  if(y>=0.92) return "1 yr"; const m=Math.round(y*12); return m<=1?"<1 mo":m+" mos"; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ==================================================================== state */
const KEY="healthrecord.v1";
const LS={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
           set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
           ok(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } } };
const S={ data:null, tab:"overview", range:"3Y", labCat:"all", labQ:"", vRange:"3Y", srcLabel:"" };
const REG=new Map(); let regN=0;
function reg(o){ const k="r"+(++regN); REG.set(k,o); return k; }

const RANGES=[{k:"1Y",y:1},{k:"3Y",y:3},{k:"5Y",y:5},{k:"10Y",y:10},{k:"ALL",y:null}];
function anchorTime(){
  let mx=Date.now();
  (S.data.labResults||[]).forEach(r=>{const t=pd(r.date); if(t>mx) mx=t;});
  (S.data.vitals||[]).forEach(r=>{const t=pd(r.date); if(t>mx) mx=t;});
  return mx;
}
function cutoff(range){ const r=RANGES.find(x=>x.k===range); return (!r||!r.y)?-Infinity:anchorTime()-r.y*365.25*DAY; }

/* ==================================================================== data */
function cat(id){ return (S.data.testCatalog||{})[id] || {name:id,unit:"",category:"Other",decimals:2}; }
/* Every result is judged against the reference laboratory's range (testCatalog), so a
   20-year trend is measured with one yardstick. The range the reporting lab printed is
   kept on the result as srcRefLow/srcRefHigh and shown in the detail table. */
function refOf(rec,c){ return { lo:c.refLow, hi:c.refHigh }; }
function srcRefOf(rec){
  if(!rec) return null;
  if(rec.srcRefLow==null && rec.srcRefHigh==null) return null;
  return { lo:rec.srcRefLow, hi:rec.srcRefHigh };
}
function refDiffers(rec,c){
  const s=srcRefOf(rec); if(!s) return false;
  return (s.lo!=null?s.lo:null)!==(c.refLow!=null?c.refLow:null) ||
         (s.hi!=null?s.hi:null)!==(c.refHigh!=null?c.refHigh:null);
}
function refTxt(lo,hi,d){
  if(lo==null&&hi==null) return "—";
  if(lo==null) return "≤ "+nf(hi,d);
  if(hi==null) return "≥ "+nf(lo,d);
  return nf(lo,d)+"–"+nf(hi,d);
}
function series(testId){
  return (S.data.labResults||[]).filter(r=>r.test===testId && typeof r.value==="number")
    .map(r=>({t:pd(r.date),v:r.value,rec:r})).sort((a,b)=>a.t-b.t);
}
function allSeries(testId){
  return (S.data.labResults||[]).filter(r=>r.test===testId)
    .map(r=>({t:pd(r.date),v:(typeof r.value==="number"?r.value:null),rec:r})).sort((a,b)=>a.t-b.t);
}
function testIds(){
  const s=new Set(); (S.data.labResults||[]).forEach(r=>s.add(r.test)); return Array.from(s);
}
function flagOf(v,lo,hi){
  if(v==null||isNaN(v)) return "na";
  if(hi!=null && v>hi) return "hi";
  if(lo!=null && v<lo) return "lo";
  if(lo==null&&hi==null) return "na";
  return "ok";
}
const FLAGTXT={hi:"High",lo:"Low",ok:"In range",na:"—"};
const FLAGCLS={hi:"p-hi",lo:"p-lo",ok:"p-ok",na:"p-mut"};
function flagColor(f){ const cs=getComputedStyle(document.documentElement);
  return cs.getPropertyValue(f==="hi"?"--bad":f==="lo"?"--low":f==="ok"?"--ok":"--tx3").trim(); }
/* did the value move toward or away from the healthy range? */
function trendQuality(prev,cur,lo,hi){
  const dist=v=>{ let d=0; if(hi!=null&&v>hi) d=v-hi; if(lo!=null&&v<lo) d=lo-v; return d; };
  const a=dist(prev), b=dist(cur);
  if(a===0&&b===0) return "flat";
  if(b<a) return "good"; if(b>a) return "bad"; return "flat";
}

/* ==================================================================== units */
/* Alternate units a report might use, and the factor that turns them into the
   record's own unit (the one the reference laboratory prints). Anything entered
   in an alternate unit is converted before it is stored, and the number as
   originally reported is kept in `orig`. */
const ALT_UNITS={
  chol_total:[["mmol/L",38.67]], ldl:[["mmol/L",38.67]], hdl:[["mmol/L",38.67]],
  nonhdl:[["mmol/L",38.67]], tg:[["mmol/L",88.57]],
  glucose_fasting:[["mmol/L",18.016]], glucose_pp:[["mmol/L",18.016]],
  creatinine:[["\u00b5mol/L",1/88.4]], urea:[["mmol/L",6.006],["mg/dL (as BUN)",2.14]],
  uric_acid:[["\u00b5mol/L",1/59.48]],
  hgb:[["g/L",0.1]], hct:[["L/L",100]],
  albumin:[["g/L",0.1]], protein_total:[["g/L",0.1]],
  bili_total:[["\u00b5mol/L",1/17.1]], bili_direct:[["\u00b5mol/L",1/17.1]],
  crp:[["mg/dL",10]], ige_total:[["kU/L",1]],
  mchc:[["g/L",0.1]], globulin:[["g/L",0.1]],
  psa:[["ng/mL",1]], magnesium:[["mg/dL",0.4114]],
  vit_d:[["ng/mL",2.496]], b12:[["pg/mL",0.738]], folate:[["ng/mL",2.266]],
  ferritin:[["ng/mL",1]], iron:[["\u00b5g/dL",0.179]], ft4:[["ng/dL",12.87]],
  tsh:[["\u00b5IU/mL",1],["uIU/mL",1]],
  wbc:[["K/\u00b5L",1],["/\u00b5L",0.001]], rbc:[["M/\u00b5L",1]],
  plt:[["K/\u00b5L",1],["/\u00b5L",0.001]],
  neut_abs:[["K/\u00b5L",1],["/\u00b5L",0.001]], lymph_abs:[["K/\u00b5L",1],["/\u00b5L",0.001]],
  mono_abs:[["K/\u00b5L",1],["/\u00b5L",0.001]], eos_abs:[["K/\u00b5L",1],["/\u00b5L",0.001]],
  baso_abs:[["K/\u00b5L",1],["/\u00b5L",0.001]],
  esr:[["mm/h",1]]
};
function unitChoices(tid,fallback){
  const c=(S.data.testCatalog||{})[tid];
  const base=(c?c.unit:fallback)||"";
  const out=[[base||"(no unit)",1]];
  (ALT_UNITS[tid]||[]).forEach(u=>{ if(u[0]!==base) out.push(u); });
  return out;
}
function refLabName(){ return (S.data&&S.data.referenceLab)||"the reference laboratory"; }

/* ==================================================================== chart */
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function rrect(x,a,b,w,h,r){
  r=Math.min(r,w/2,h/2);
  x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}
/* points inside a window, plus the nearest neighbour each side so lines
   enter and leave the plot instead of stopping at the edge */
function splitWin(pts,t0,t1){
  const inW=[]; let before=null,after=null;
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    if(p.t<t0) before=p;
    else if(p.t>t1){ if(!after) after=p; }
    else inW.push(p);
  }
  return {inW:inW,before:before,after:after};
}
function fullExtent(cfg){
  let a=Infinity,b=-Infinity;
  cfg.series.forEach(s=>s.points.forEach(p=>{ if(p.t<a)a=p.t; if(p.t>b)b=p.t; }));
  return isFinite(a)?{t0:a,t1:b}:null;
}
/* Geometry of the dial. The selected window is never drawn narrower than
   MINPX, so a one-year window on a twenty-year dial is still big enough to
   grab; the hit-test uses exactly the same numbers as the painter. */
const BR_PAD=8, BR_MINPX=28;
function brushGeo(W,full,win){
  const PL=BR_PAD, w=Math.max(20,W-BR_PAD*2), fs=Math.max(1,full.t1-full.t0);
  const X=t=>PL+(t-full.t0)/fs*w;
  let a=X(win.t0), b=X(win.t1);
  if(b-a<BR_MINPX){ const c=(a+b)/2; a=c-BR_MINPX/2; b=c+BR_MINPX/2; }
  if(a<PL){ b+=PL-a; a=PL; }
  if(b>PL+w){ a-=b-(PL+w); b=PL+w; }
  a=Math.max(PL,a);
  /* grips shrink with the window and vanish once it is too small to split,
     leaving the whole bar as a pan target */
  const wpx=b-a, grip = wpx>=80?18 : wpx>=52?12 : 0;
  return {PL:PL,w:w,fs:fs,X:X,a:a,b:b,grip:grip};
}
function clampWin(v){
  const F=v.full, fs=F.t1-F.t0;
  let span=v.win.t1-v.win.t0;
  if(span>fs||span<=0){ v.win.t0=F.t0; v.win.t1=F.t1; return; }
  if(v.win.t0<F.t0){ v.win.t0=F.t0; v.win.t1=F.t0+span; }
  if(v.win.t1>F.t1){ v.win.t1=F.t1; v.win.t0=F.t1-span; }
}

/* main plot for the window win={t0,t1} */
function drawChart(cv,cfg,win){
  const box=cv.parentElement, W=box.clientWidth||300, H=cfg.height||120;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.max(1,Math.round(W*dpr)); cv.height=Math.round(H*dpr);
  cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const axis=cfg.axis!==false;
  const PL=axis?44:6, PR=axis?12:6, PT=8, PB=axis?20:6;
  const w=W-PL-PR, h=H-PT-PB;
  if(w<10||h<10) return null;

  let t0=win.t0,t1=win.t1;
  if(t1-t0<DAY*2){ const c=(t0+t1)/2; t0=c-DAY; t1=c+DAY; }
  const parts=cfg.series.map(s=>splitWin(s.points,t0,t1));
  let vis=[]; parts.forEach(p=>{ vis=vis.concat(p.inW); });

  if(!vis.length){
    x.fillStyle=cssv("--tx3"); x.textAlign="center";
    x.font=(axis?"12px":"11px")+" -apple-system,system-ui,sans-serif";
    let bf=null,af=null;
    parts.forEach(p=>{ if(p.before&&(!bf||p.before.t>bf.t)) bf=p.before;
                       if(p.after&&(!af||p.after.t<af.t)) af=p.after; });
    const L=["Nothing recorded in this window"];
    if(bf) L.push("Previous: "+nf(bf.v,cfg.decimals)+" "+(cfg.unit||"")+" \u00b7 "+fmtT(bf.t));
    if(af) L.push("Next: "+nf(af.v,cfg.decimals)+" "+(cfg.unit||"")+" \u00b7 "+fmtT(af.t));
    L.slice(0,axis?3:2).forEach((m,i,ar)=>x.fillText(m,W/2,H/2+(i-(ar.length-1)/2)*15+4));
    return null;
  }

  let dMin=Math.min.apply(null,vis.map(p=>p.v)), dMax=Math.max.apply(null,vis.map(p=>p.v));
  const band=cfg.band||{};
  let lo=dMin,hi=dMax;
  if(band.lo!=null) lo=Math.min(lo,band.lo);
  if(band.hi!=null) hi=Math.max(hi,band.hi);
  const dSpan=Math.max(dMax-dMin,1e-9);
  if((hi-lo)>dSpan*3.2){ lo=Math.max(lo,dMin-dSpan*0.9); hi=Math.min(hi,dMax+dSpan*0.9); }
  if(hi-lo<1e-9){ const p=Math.abs(hi)*0.12||1; lo-=p; hi+=p; }
  const padv=(hi-lo)*0.10; lo-=padv; hi+=padv;

  const X=t=> PL+(t-t0)/Math.max(1,(t1-t0))*w;
  const Y=v=> PT+(1-(v-lo)/(hi-lo))*h;

  if(band.lo!=null||band.hi!=null){
    const yb=Y(band.hi!=null?Math.min(band.hi,hi):hi), yt=Y(band.lo!=null?Math.max(band.lo,lo):lo);
    x.fillStyle=cssv("--band"); x.fillRect(PL,Math.min(yb,yt),w,Math.abs(yt-yb));
    x.strokeStyle=cssv("--grid"); x.setLineDash([3,4]); x.lineWidth=1;
    [band.lo,band.hi].forEach(v=>{ if(v==null||v<lo||v>hi) return;
      x.beginPath(); x.moveTo(PL,Y(v)+.5); x.lineTo(PL+w,Y(v)+.5); x.stroke(); });
    x.setLineDash([]);
  }
  if(axis){
    x.font="10px -apple-system,system-ui,sans-serif"; x.fillStyle=cssv("--tx3"); x.textAlign="right";
    for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=Y(v);
      x.strokeStyle=cssv("--grid"); x.lineWidth=1;
      x.beginPath(); x.moveTo(PL,y+.5); x.lineTo(PL+w,y+.5); x.stroke();
      x.fillText(nf(v,(hi-lo)<3?2:(hi-lo)<30?1:0),PL-6,y+3.5);
    }
    x.textAlign="center";
    const span=t1-t0, nT=W<380?3:W<640?4:6;
    for(let i=0;i<=nT;i++){ const t=t0+span*i/nT, d=new Date(t);
      let lb;
      if(span>3.2*365*DAY) lb=String(d.getUTCFullYear());
      else if(span>150*DAY) lb=fmtDS(t);
      else lb=d.getUTCDate()+" "+MON[d.getUTCMonth()];
      x.fillText(lb,Math.min(W-14,Math.max(PL+8,X(t))),H-6);
    }
  }

  x.save(); x.beginPath(); x.rect(PL-1,PT-4,w+2,h+8); x.clip();
  cfg.series.forEach((s,si)=>{
    const pt=parts[si], line=[];
    if(pt.before) line.push(pt.before);
    pt.inW.forEach(p=>line.push(p));
    if(pt.after) line.push(pt.after);
    if(!line.length) return;
    if(line.length>1){
      if(s.fill){
        const g=x.createLinearGradient(0,PT,0,PT+h);
        g.addColorStop(0,s.color+"33"); g.addColorStop(1,s.color+"00");
        x.fillStyle=g; x.beginPath(); x.moveTo(X(line[0].t),PT+h);
        line.forEach(p=>x.lineTo(X(p.t),Y(p.v))); x.lineTo(X(line[line.length-1].t),PT+h);
        x.closePath(); x.fill();
      }
      x.strokeStyle=s.color; x.lineWidth=s.width||2; x.lineJoin="round"; x.lineCap="round";
      if(s.dash) x.setLineDash(s.dash);
      x.beginPath(); line.forEach((p,i)=> i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));
      x.stroke(); x.setLineDash([]);
    }
    const dots=pt.inW, showAll=dots.length<=90;
    dots.forEach((p,i)=>{
      const last=(i===dots.length-1);
      if(!showAll&&!last) return;
      x.beginPath(); x.arc(X(p.t),Y(p.v),last?3.6:2.6,0,7);
      x.fillStyle=(s.dotByFlag&&p.flag)?flagColor(p.flag):s.color; x.fill();
      if(last){ x.strokeStyle=cssv("--panel"); x.lineWidth=1.6; x.stroke(); }
    });
  });
  x.restore();
  return {X:X,Y:Y,t0:t0,t1:t1,lo:lo,hi:hi,PL:PL,PT:PT,w:w,h:h,W:W,H:H};
}

/* the scroll dial: whole history in miniature with a draggable window */
function drawBrush(cv,cfg,full,win,compact){
  const box=cv.parentElement, W=box.clientWidth||300, H=compact?32:46;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.max(1,Math.round(W*dpr)); cv.height=Math.round(H*dpr);
  cv.style.height=H+"px"; cv.style.width="100%";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const PL=8,PR=8,PT=4,PB=compact?4:12, w=W-PL-PR, h=H-PT-PB;
  if(w<20||h<8) return;
  const fs=Math.max(1,full.t1-full.t0);
  const X=t=>PL+(t-full.t0)/fs*w;

  let vs=[]; cfg.series.forEach(s=>s.points.forEach(p=>vs.push(p.v)));
  let lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  if(!(hi>lo)){ lo-=1; hi+=1; }
  const Y=v=>PT+2+(1-(v-lo)/(hi-lo))*(h-4);

  x.fillStyle=cssv("--panel2"); rrect(x,PL,PT,w,h,7); x.fill();
  x.save(); rrect(x,PL,PT,w,h,7); x.clip();
  cfg.series.forEach(s=>{
    if(s.points.length<2){
      s.points.forEach(p=>{ x.fillStyle=s.color; x.beginPath(); x.arc(X(p.t),Y(p.v),2,0,7); x.fill(); });
      return;
    }
    x.strokeStyle=s.color; x.lineWidth=1.2; x.globalAlpha=.85; x.lineJoin="round";
    x.beginPath(); s.points.forEach((p,i)=> i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));
    x.stroke(); x.globalAlpha=1;
  });
  x.restore();

  const bg=brushGeo(W,full,win), a=bg.a, b=bg.b;
  x.fillStyle=cssv("--bg"); x.globalAlpha=.66;
  if(a>PL) x.fillRect(PL,PT,a-PL,h);
  if(b<PL+w) x.fillRect(b,PT,PL+w-b,h);
  x.globalAlpha=1;
  const acc=cssv("--acc");
  x.fillStyle=acc; x.globalAlpha=.10; rrect(x,a,PT,b-a,h,4); x.fill(); x.globalAlpha=1;
  x.strokeStyle=acc; x.lineWidth=1.5; rrect(x,a,PT+.75,Math.max(3,b-a),h-1.5,4); x.stroke();
  const hh=Math.min(18,h-4);
  [a,b].forEach(hx=>{
    x.fillStyle=acc; rrect(x,hx-3.5,PT+(h-hh)/2,7,hh,3.5); x.fill();
    if(bg.grip){
      x.strokeStyle=cssv("--panel"); x.lineWidth=1; x.beginPath();
      x.moveTo(hx-1.3,PT+h/2-3.5); x.lineTo(hx-1.3,PT+h/2+3.5);
      x.moveTo(hx+1.3,PT+h/2-3.5); x.lineTo(hx+1.3,PT+h/2+3.5); x.stroke();
    }
  });

  if(!compact){
    x.fillStyle=cssv("--tx3"); x.font="9.5px -apple-system,system-ui,sans-serif"; x.textAlign="center";
    const y0=new Date(full.t0).getUTCFullYear(), y1=new Date(full.t1).getUTCFullYear();
    const ny=y1-y0, step=ny>18?5:ny>9?2:1;
    for(let y=Math.ceil(y0/step)*step;y<=y1;y+=step){
      const px=X(Date.UTC(y,0,1));
      if(px<PL-2||px>PL+w+2) continue;
      x.fillText(String(y),Math.min(W-12,Math.max(12,px)),H-2);
    }
  }
}

function attachBrush(box,cv,view,compact){
  let mode=null, gx=0, w0=null;
  const MINW=DAY*14;
  const geo=()=>brushGeo(cv.clientWidth||300,view.full,view.win);
  const px=e=>e.clientX-cv.getBoundingClientRect().left;
  function down(e){
    if(cv.setPointerCapture) try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    const g=geo(), p=px(e);
    w0={t0:view.win.t0,t1:view.win.t1}; gx=p;
    if(g.grip&&Math.abs(p-g.a)<=g.grip) mode="l";
    else if(g.grip&&Math.abs(p-g.b)<=g.grip) mode="r";
    else if(p>=g.a-6&&p<=g.b+6) mode="m";
    else{
      const span=view.win.t1-view.win.t0, c=view.full.t0+(p-g.PL)/g.w*g.fs;
      view.win={t0:c-span/2,t1:c+span/2}; clampWin(view);
      w0={t0:view.win.t0,t1:view.win.t1}; mode="m"; view.render();
      if(view.onWindow) view.onWindow();
    }
    box.classList.add("drag"); e.preventDefault();
  }
  function move(e){
    if(!mode) return;
    const g=geo(), d=(px(e)-gx)/g.w*g.fs;
    if(mode==="m"){ view.win={t0:w0.t0+d,t1:w0.t1+d}; }
    else if(mode==="l"){ view.win={t0:Math.min(w0.t0+d,w0.t1-MINW),t1:w0.t1}; }
    else { view.win={t0:w0.t0,t1:Math.max(w0.t1+d,w0.t0+MINW)}; }
    clampWin(view); view.render(); if(view.onWindow) view.onWindow();
    e.preventDefault();
  }
  function up(){ if(mode){ mode=null; box.classList.remove("drag"); } }
  cv.addEventListener("pointerdown",down);
  cv.addEventListener("pointermove",move);
  cv.addEventListener("pointerup",up);
  cv.addEventListener("pointercancel",up);
  cv.addEventListener("pointerleave",up);
  cv.addEventListener("dblclick",()=>{ view.win={t0:view.full.t0,t1:view.full.t1};
    view.render(); if(view.onWindow) view.onWindow(); });
}

/* crosshair readout on the main plot */
function attachScrub(box,cv,view){
  let tip=box.querySelector(".tip");
  if(!tip){ tip=document.createElement("div"); tip.className="tip"; box.appendChild(tip); }
  const cfg=view.cfg;
  function move(ev){
    const g=box._geo;
    if(!g){ tip.classList.remove("on"); return; }
    const rect=cv.getBoundingClientRect();
    const mx=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
    let best=null,bd=1e12;
    cfg.series.forEach(s=>s.points.forEach(p=>{
      if(p.t<g.t0||p.t>g.t1) return;
      const d=Math.abs(g.X(p.t)-mx); if(d<bd){ bd=d; best=p; }
    }));
    if(!best||bd>60){ tip.classList.remove("on"); redraw(); return; }
    const stack=[];
    cfg.series.forEach(s=>{ const m=s.points.filter(p=>p.t===best.t); if(m.length) stack.push({s:s,p:m[0]}); });
    redraw();
    const x=cv.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,2.5);
    x.setTransform(dpr,0,0,dpr,0,0);
    x.strokeStyle=cssv("--tx3"); x.globalAlpha=.55; x.lineWidth=1; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(g.X(best.t),g.PT); x.lineTo(g.X(best.t),g.PT+g.h); x.stroke();
    x.setLineDash([]); x.globalAlpha=1;
    stack.forEach(it=>{ x.beginPath(); x.arc(g.X(it.p.t),g.Y(it.p.v),4.6,0,7);
      x.fillStyle=it.s.color; x.fill(); x.strokeStyle=cssv("--panel"); x.lineWidth=2; x.stroke(); });
    tip.innerHTML='<div class="muted" style="font-size:11px;margin-bottom:2px">'+fmtT(best.t)+'</div>'+
      stack.map(it=>'<div><span style="color:'+it.s.color+'">\u25cf</span> '+
        (cfg.series.length>1?esc(it.s.name)+" ":"")+'<b>'+nf(it.p.v,cfg.decimals)+'</b> <span class="muted">'+
        esc(cfg.unit||"")+'</span></div>').join("");
    tip.style.left=Math.min(Math.max(g.X(best.t),60),g.W-60)+"px";
    tip.style.top=g.Y(best.v!=null?best.v:stack[0].p.v)+"px";
    tip.classList.add("on");
  }
  function redraw(){ box._geo=drawChart(cv,cfg,view.win); }
  function end(){ tip.classList.remove("on"); redraw(); }
  cv.addEventListener("pointermove",move);
  cv.addEventListener("pointerdown",e=>{ if(cv.setPointerCapture) try{cv.setPointerCapture(e.pointerId);}catch(_){}; move(e); });
  cv.addEventListener("pointerup",end);
  cv.addEventListener("pointerleave",end);
  cv.addEventListener("pointercancel",end);
}

const CHARTS=new Set();
/* opt.brush : "full" | "compact" | false */
function mountChart(box,cfg,opt){
  opt=opt||{};
  const main=document.createElement("canvas"); box.appendChild(main);
  const view={cfg:cfg,box:box,full:null,win:null,render:null};
  const ext=fullExtent(cfg);
  if(!ext){
    const now=Date.now();
    view.full={t0:now-365*DAY,t1:now}; view.win={t0:view.full.t0,t1:view.full.t1};
    view.render=()=>{ box._geo=drawChart(main,cfg,view.win); };
    view.render(); CHARTS.add(view.render); return view;
  }
  const pad=Math.max((ext.t1-ext.t0)*0.03, DAY*25);
  view.full={t0:ext.t0-pad, t1:Math.max(ext.t1,anchorTime())+pad*0.5};
  view.win={ t0:(cfg.from!=null?cfg.from:view.full.t0), t1:(cfg.to!=null?cfg.to:view.full.t1) };
  clampWin(view);

  const mode=opt.brush||false;
  let bwrap=null,bcv=null,lbl=null;
  if(mode){
    bwrap=document.createElement("div"); bwrap.className="brush"; box.appendChild(bwrap);
    bcv=document.createElement("canvas"); bwrap.appendChild(bcv);
    if(mode==="full"){
      lbl=document.createElement("div"); lbl.className="brush-lbl";
      lbl.innerHTML='<span class="bl-range"></span><span class="muted bl-hint"></span>'+
        '<span class="zoomer"><button data-z="out" title="Show a longer period">\u2212</button>'+
        '<button data-z="in" title="Show a shorter period">+</button>'+
        '<button data-z="all" title="Show the whole history">\u21c4</button></span>';
      box.appendChild(lbl);
      lbl.addEventListener("click",e=>{
        const b=e.target.closest("[data-z]"); if(!b) return;
        const c=(view.win.t0+view.win.t1)/2, sp=view.win.t1-view.win.t0;
        if(b.dataset.z==="all") view.win={t0:view.full.t0,t1:view.full.t1};
        else{
          const k=b.dataset.z==="in"?1/1.9:1.9;
          const ns=Math.max(DAY*14,Math.min(sp*k,view.full.t1-view.full.t0));
          view.win={t0:c-ns/2,t1:c+ns/2};
        }
        clampWin(view); view.render(); if(view.onWindow) view.onWindow();
      });
    }
  }
  view.render=function(){
    box._geo=drawChart(main,cfg,view.win);
    if(bcv) drawBrush(bcv,cfg,view.full,view.win,mode==="compact");
    if(lbl){
      const sp=view.win.t1-view.win.t0, y=sp/(365.25*DAY), ys=nf(y,1);
      const span=y>=1?ys+(ys==="1"?" year":" years"):Math.round(sp/DAY)+" days";
      lbl.querySelector(".bl-range").innerHTML='<b>'+fmtT(view.win.t0)+'</b> \u2192 <b>'+fmtT(view.win.t1)+'</b>';
      lbl.querySelector(".bl-hint").textContent=span+" shown \u00b7 drag the bar to scroll through the record";
    }
  };
  view.render();
  attachScrub(box,main,view);
  if(bcv) attachBrush(bwrap,bcv,view,mode==="compact");
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>view.render()); ro.observe(box); }
  CHARTS.add(view.render);
  return view;
}
function clearCharts(){ CHARTS.clear(); }

/* ==================================================================== ticker card */
function labSeriesCfg(testId,range,opts){
  const c=cat(testId), o=opts||{};
  const r={lo:c.refLow,hi:c.refHigh};
  /* every point is handed to the chart; `range` only sets the opening window,
     and the scroll dial moves it over the rest of the history */
  const pts=series(testId).map(p=>({t:p.t,v:p.v,rec:p.rec,flag:flagOf(p.v,r.lo,r.hi)}));
  const cut=cutoff(range);
  return {
    series:[{name:c.name,points:pts,color:cssv("--acc"),fill:true,dotByFlag:true}],
    band:{lo:c.refLow,hi:c.refHigh}, decimals:c.decimals, unit:c.unit,
    height:o.height||120, axis:o.axis!==false,
    from: range==="ALL"?undefined:cut, to: range==="ALL"?undefined:anchorTime()
  };
}
function tickerCard(testId,range,opts){
  const c=cat(testId), o=opts||{}, all=allSeries(testId);
  if(!all.length) return null;
  const last=all[all.length-1], prev=all.length>1?all[all.length-2]:null;
  const r=refOf(last.rec,c);
  const f=flagOf(last.v,r.lo,r.hi);
  const el=document.createElement("div"); el.className="card tk";
  let delta="";
  if(prev&&prev.v!=null&&last.v!=null&&prev.v!==0){
    const d=last.v-prev.v, q=trendQuality(prev.v,last.v,r.lo,r.hi);
    const col=q==="good"?"var(--ok)":q==="bad"?"var(--bad)":"var(--tx3)";
    delta='<span class="tk-d num" style="color:'+col+'">'+(d>0?"▲":d<0?"▼":"▬")+" "+
      nf(Math.abs(d),c.decimals)+' <span style="opacity:.7">('+(d>0?"+":"")+nf(d/Math.abs(prev.v)*100,1)+'%)</span></span>';
  }
  const val = last.v!=null ? nf(last.v,c.decimals) : esc(last.rec.text||"—");
  el.innerHTML=
    '<div class="tk-h"><div class="tk-n">'+esc(c.name)+'</div>'+
      '<span class="pill '+FLAGCLS[f]+'"><i class="dot"></i>'+FLAGTXT[f]+'</span></div>'+
    '<div class="tk-v"><b class="num">'+val+'</b><span class="tk-u">'+esc(c.unit||"")+'</span>'+delta+'</div>'+
    '<div class="chartbox"></div>'+
    '<div class="tk-f"><span>'+fmtD(last.rec.date)+'</span><span>'+all.length+' result'+(all.length>1?"s":"")+
      (r.lo!=null||r.hi!=null?' · ref '+(r.lo!=null?nf(r.lo,c.decimals):"")+'–'+(r.hi!=null?nf(r.hi,c.decimals):""):"")+'</span></div>';
  const box=el.querySelector(".chartbox");
  if(series(testId).length>1) mountChart(box,labSeriesCfg(testId,range,{height:o.h||58,axis:false}),{brush:o.brush||false});
  else if(series(testId).length) mountChart(box,labSeriesCfg(testId,"ALL",{height:o.h||58,axis:false}));
  else box.innerHTML='<div class="small muted" style="padding:12px 0">Qualitative result — no chart</div>';
  el.addEventListener("click",e=>{ if(e.target.closest("canvas")&&e.type!=="click") return; openTest(testId); });
  return el;
}

/* ---------------------------------------------------------------- overview */
const KEYTESTS=["hgb","hct","rbc","ldl","hdl","tg","uric_acid","hba1c","creatinine","wbc","alt","crp"];
function vOverview(){
  const v=$("#v-overview"); v.innerHTML="";

  /* hero */

    ["Age", (ageAt(p.dob,now)!=null?ageAt(p.dob,now):"—"), p.dob?"born "+fmtD(p.dob):""],

  v.appendChild(hero);

function openTest(testId){
  const c=cat(testId), all=allSeries(testId);
  let rng=S.range;
  const body=document.createElement("div");
  function build(){

/* ---------------------------------------------------------------- vitals */
function bpCat(s,d){
  if(s>180||d>120) return {t:"Hypertensive crisis",c:"p-hi"};
  if(s>=140||d>=90) return {t:"Stage 2",c:"p-hi"};
  if(s>=130||d>=80) return {t:"Stage 1",c:"p-wn"};
  if(s>=120) return {t:"Elevated",c:"p-wn"};
  return {t:"Normal",c:"p-ok"};
}
function vVitals(){
  const v=$("#v-vitals"); v.innerHTML=""; clearCharts();
  const all=(S.data.vitals||[]).slice().sort((a,b)=>
    (pd(a.date)-pd(b.date))||String(a.time||"").localeCompare(String(b.time||"")));
  if(!all.length){ v.innerHTML='<div class="card empty">No vitals recorded yet. Use <b>Add</b> to log a blood-pressure reading.</div>'; return; }

  const bar=document.createElement("div"); bar.className="toolbar";
  bar.innerHTML='<h2 style="font-size:16px;margin-right:auto">Blood pressure & vital signs</h2>';
  bar.appendChild(rangeBar(S.vRange,r=>{S.vRange=r; vVitals();}));
  v.appendChild(bar);

  const cut=cutoff(S.vRange);
  const rows=all.filter(r=>pd(r.date)>=cut);
  const use=rows.length?rows:all;
  const tOf=r=>pd(r.date)+(r.time?(parseInt(r.time.slice(0,2),10)*3600+parseInt(r.time.slice(3,5),10)*60)*1000:0);

  const bp=use.filter(r=>r.systolic!=null);
  const bpAll=all.filter(r=>r.systolic!=null);
  const last=bpAll.slice(-1)[0];
  if(bp.length){
    const sysV=bp.map(r=>r.systolic), diaV=bp.map(r=>r.diastolic), pulV=bp.filter(r=>r.pulse!=null).map(r=>r.pulse);
    const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

    const cta=bpCat(last.systolic,last.diastolic);

    st.innerHTML=[
      ["Latest",last.systolic+"/"+last.diastolic,fmtD(last.date)+(last.time?" "+last.time:"")+" · "+cta.t],
      ["Average",Math.round(avg(sysV))+"/"+Math.round(avg(diaV)),bp.length+" readings in range"],
      ["Highest",Math.max.apply(null,sysV)+"/"+Math.max.apply(null,diaV),"peak systolic / peak diastolic"],
      ["Lowest",Math.min.apply(null,sysV)+"/"+Math.min.apply(null,diaV),"trough systolic / trough diastolic"],
      ["At target",Math.round(inT/bp.length*100)+"%","below 130/80"],
      ["Resting pulse",pulV.length?Math.round(avg(pulV)):"—",pulV.length?"range "+Math.min.apply(null,pulV)+"–"+Math.max.apply(null,pulV)+" bpm":"—"],
    ].map(t=>'<div class="card stat"><div class="l">'+t[0]+'</div><div class="v num">'+esc(t[1])+'</div><div class="s">'+esc(t[2])+'</div></div>').join("");
    v.appendChild(st);

    const cd=document.createElement("div"); cd.className="card sec"; cd.style.padding="12px 8px 6px";
    const cb=document.createElement("div"); cb.className="chartbox"; cd.appendChild(cb);
    v.appendChild(cd);
    mountChart(cb,{
      series:[
        {name:"Systolic",points:bpAll.map(r=>({t:tOf(r),v:r.systolic,rec:r})),color:cssv("--bad"),width:2},
        {name:"Diastolic",points:bpAll.map(r=>({t:tOf(r),v:r.diastolic,rec:r})),color:cssv("--acc"),width:2},
        {name:"Pulse",points:bpAll.filter(r=>r.pulse!=null).map(r=>({t:tOf(r),v:r.pulse,rec:r})),color:cssv("--tx3"),width:1.3,dash:[4,3]},
      ],
      band:{lo:70,hi:130}, decimals:0, unit:"mmHg", height:270, axis:true,
      from: S.vRange==="ALL"?undefined:cut, to: S.vRange==="ALL"?undefined:anchorTime()
    },{brush:"full"});
    const lg=document.createElement("div"); lg.className="legend"; lg.style.margin="-8px 0 18px";
    lg.innerHTML='<span><i style="background:'+cssv("--bad")+'"></i>Systolic</span><span><i style="background:'+cssv("--acc")+'"></i>Diastolic</span>'+
      '<span><i style="background:'+cssv("--tx3")+'"></i>Pulse (bpm)</span><span><i style="background:var(--band);border:1px solid var(--line2)"></i>Target zone 70–130</span>';
    v.appendChild(lg);
  }

  /* other numeric vitals if present */
  const extras=[["weight","Weight","kg",1],["bmi","BMI","",1],["spo2","SpO₂","%",0],
                ["temp","Temperature","°C",1],["glucose","Home glucose","mg/dL",0],["waist","Waist","cm",1]];
  const has=extras.filter(e=>all.some(r=>r[e[0]]!=null));
  if(has.length){
    const s=document.createElement("div"); s.className="sec";
    s.innerHTML='<div class="sech"><h2>Other vitals</h2></div>';
    const g=document.createElement("div"); g.className="grid g-charts";
    has.forEach(e=>{
      const allPts=all.filter(r=>r[e[0]]!=null).map(r=>({t:tOf(r),v:+r[e[0]],rec:r}));
      const pts=use.filter(r=>r[e[0]]!=null);
      const lastv=all.filter(r=>r[e[0]]!=null).slice(-1)[0];
      const card=document.createElement("div"); card.className="card tk";
      card.innerHTML='<div class="tk-h"><div class="tk-n">'+e[1]+'</div></div>'+
        '<div class="tk-v"><b class="num">'+nf(lastv[e[0]],e[3])+'</b><span class="tk-u">'+e[2]+'</span></div>'+
        '<div class="chartbox"></div><div class="tk-f"><span>'+fmtD(lastv.date)+'</span><span>'+pts.length+' readings</span></div>';
      g.appendChild(card);
      mountChart(card.querySelector(".chartbox"),{series:[{name:e[1],points:allPts,color:cssv("--acc"),fill:true}],
        decimals:e[3],unit:e[2],height:96,axis:false,
        from:S.vRange==="ALL"?undefined:cut, to:S.vRange==="ALL"?undefined:anchorTime()},
        {brush:allPts.length>1?"compact":false});
    });
    s.appendChild(g); v.appendChild(s);
  }

  /* table */
  const s=document.createElement("div"); s.className="sec";
  s.innerHTML='<div class="sech"><h2>Reading log</h2><span class="sub">'+use.length+' entries · newest first</span></div>'+
    '<div class="card tbl-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>BP</th><th>Pulse</th>'+
    '<th>Category</th><th>Note</th><th></th></tr></thead><tbody>'+
    use.slice().reverse().map(r=>{
      const c=r.systolic?bpCat(r.systolic,r.diastolic):null;
      return '<tr><td class="num">'+fmtD(r.date)+'</td><td class="num muted">'+esc(r.time||"—")+'</td>'+
      '<td class="num"><b>'+(r.systolic?r.systolic+"/"+r.diastolic:"—")+'</b></td>'+
      '<td class="num">'+(r.pulse!=null?r.pulse:"—")+'</td>'+
      '<td>'+(c?'<span class="pill '+c.c+'">'+c.t+'</span>':"—")+'</td>'+
      '<td class="small muted">'+esc(r.note||"")+(r.medTaken?' <span class="pill p-acc">med taken</span>':"")+'</td>'+
      '<td><button class="del" data-del="'+reg(r)+'">×</button></td></tr>';
    }).join("")+'</tbody></table></div>';
  v.appendChild(s);
  $$("[data-del]",s).forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Delete this reading?")) return;
    const o=REG.get(b.dataset.del), i=S.data.vitals.indexOf(o);
    if(i>=0){S.data.vitals.splice(i,1); save(); vVitals(); toast("Reading deleted");}
  }));
}

/* ---------------------------------------------------------------- timeline */
const CLSCOL={"Antihypertensive":"#ef4444","Lipid-lowering":"#3b82f6","Antiplatelet":"#a855f7",
  "Supplement":"#22c55e","GLP-1 / GIP agonist":"#f59e0b","Other":"#64748b"};
function condColor(c){ return {severe:"#dc2626",moderate:"#f59e0b",mild:"#3b82f6"}[c.severity]||"#64748b"; }
function buildTimeline(items,opt){
  /* items: {label, sub, start, end, ongoing, color, text}
     A missing start, or a missing end on a finished course, is drawn as a faded edge —
     never as a bar running all the way to today. */
  const now=Date.now(), FADE=2*365.25*DAY;
  items.forEach(i=>{
    let a=i.start?pd(i.start):null, b=i.end?pd(i.end):null;
    i._fl=false; i._fr=false;
    if(a==null){ a=(b!=null?b:now)-FADE; i._fl=true; }
    if(b==null){
      if(i.ongoing){ b=now; }
      else { b=Math.min(now,a+FADE); i._fr=true; }
    }
    i._a=a; i._b=Math.max(a+DAY*10,b);
  });
  let t0=Infinity,t1=now;
  items.forEach(i=>{ t0=Math.min(t0,i._a); t1=Math.max(t1,i._b); });
  if(!isFinite(t0)) return document.createTextNode("");
  const y0=new Date(t0).getUTCFullYear(), y1=new Date(t1).getUTCFullYear()+1;
  const T0=Date.UTC(y0,0,1), T1=Date.UTC(y1,0,1);
  const pct=t=>((t-T0)/(T1-T0)*100);
  const years=[]; for(let y=y0;y<=y1;y++) years.push(y);
  const step=years.length>16?5:years.length>9?2:1;

  const wrap=document.createElement("div"); wrap.className="tl-scroll";
  const tl=document.createElement("div"); tl.className="tl";
  tl.style.setProperty("--lbl",(opt&&opt.lbl)||"190px");
  tl.style.setProperty("--gw",(100/years.length)+"%");
  let ax='<div class="tl-axis">';
  years.forEach((y,i)=>{ if(i%step===0) ax+='<span style="left:'+pct(Date.UTC(y,0,1))+'%">'+y+'</span>'; });
  ax+='</div>';
  tl.innerHTML=ax;
  items.forEach(i=>{
    const L=Math.max(0,pct(i._a)), R=Math.min(100,pct(i._b)), C=i.color;
    let bg;
    if(i._fl&&i._fr) bg="linear-gradient(90deg,transparent,"+C+" 32%,"+C+" 68%,transparent)";
    else if(i._fl)   bg="linear-gradient(90deg,transparent,"+C+" 48%,"+C+")";
    else if(i._fr)   bg="linear-gradient(90deg,"+C+","+C+" 52%,transparent)";
    else if(i.ongoing&&!i.end) bg="linear-gradient(90deg,"+C+" 74%,"+C+"55)";
    else bg=C;
    let tip=i.text||"";
    if(i._fl) tip+=" — start date not recorded";
    if(i._fr) tip+=" — end date not recorded";
    const row=document.createElement("div"); row.className="tl-row";
    row.innerHTML='<div class="tl-lbl">'+esc(i.label)+(i.sub?'<small>'+esc(i.sub)+'</small>':'')+'</div>'+
      '<div class="tl-track"><div class="tl-bar" style="left:'+L+'%;width:'+Math.max(0.7,R-L)+'%;background:'+bg+'"'+
      ' title="'+esc(tip)+'">'+esc(i.barText||"")+'</div>'+
      '<div class="tl-today" style="left:'+pct(now)+'%"></div></div>';
    tl.appendChild(row);
  });
  wrap.appendChild(tl);
  return wrap;
}

function condCard(c){
  const d=document.createElement("div"); d.className="card"; d.style.padding="14px";
  const sev={severe:"p-hi",moderate:"p-wn",mild:"p-lo"}[c.severity]||"p-mut";
  const st={active:"p-hi",monitoring:"p-wn",controlled:"p-ok",resolved:"p-mut"}[c.status]||"p-mut";

  d.innerHTML='<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">'+
    '<b style="font-size:15px;flex:1">'+esc(c.name)+'</b>'+

    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px">'+
      '<span class="pill p-mut">'+esc(c.category||"")+'</span>'+
      (c.severity?'<span class="pill '+sev+'">'+esc(c.severity)+'</span>':'')+
      '<span class="pill p-mut">'+dur+'</span></div>'+
    '<div class="kv"><b>Onset</b><span>'+fmtD(c.onset)+(c.onsetApprox?" (approx.)":"")+
      (c.resolved?' → resolved '+fmtD(c.resolved):"")+'</span></div>'+
    (c.note?'<div style="margin-top:9px;font-size:13px;color:var(--tx2);line-height:1.55">'+esc(c.note)+'</div>':'')+
    '<div style="margin-top:10px;text-align:right"><button class="del" data-del="'+reg(c)+'">× remove</button></div>';
  d.querySelector("[data-del]").addEventListener("click",()=>{
    if(!confirm("Delete this condition?")) return;
    const i=S.data.conditions.indexOf(c);
    if(i>=0){S.data.conditions.splice(i,1); save(); vConditions(); renderTabs(); toast("Condition deleted");}
  });
  return d;
}

/* ---------------------------------------------------------------- food IgG */
function vFood(){
  const v=$("#v-food"); v.innerHTML=""; clearCharts();
  const f=S.data.foodIgG;
  if(!f||!f.positives||!f.positives.length){ v.innerHTML='<div class="card empty">No food-sensitivity panel on file.</div>'; return; }
  const BC={high:"#dc2626",mid:"#f59e0b",low:"#3b82f6",ok:"#22c55e"};
  const bandOf=v=> v>=20?"high":v>=10?"mid":v>=5?"low":"ok";
  const bandLbl={high:"Very high",mid:"Moderate",low:"Low",ok:"Negative"};

  v.innerHTML='<div class="sech"><h2>Food-specific IgG panel</h2><span class="sub">'+
    esc(f.method||"")+' · '+fmtD(f.date)+' · '+(f.antigensTested||"?")+' antigens tested</span></div>'+
    '<div class="note warn" style="margin-bottom:16px"><b>Read this first.</b> '+esc(f.disclaimer||"")+'</div>';

  const mx=Math.max.apply(null,f.positives.map(p=>p.value));
  const groups={}; f.positives.forEach(p=>{ (groups[p.group]=groups[p.group]||[]).push(p); });
  const order=Object.keys(groups).sort((a,b)=>
    Math.max.apply(null,groups[b].map(p=>p.value))-Math.max.apply(null,groups[a].map(p=>p.value)));

  const stats=document.createElement("div"); stats.className="grid g-tiles sec";
  const cnt=k=>f.positives.filter(p=>bandOf(p.value)===k).length;
  stats.innerHTML=[
    ["Reactive antigens",f.positives.length,"of "+(f.antigensTested||"?")+" tested"],
    ["Very high (≥20)",cnt("high"),"strongest reactions"],
    ["Moderate (10–19.9)",cnt("mid"),""],
    ["Low (5–9.9)",cnt("low"),""],
  ].map(t=>'<div class="card stat"><div class="l">'+t[0]+'</div><div class="v num">'+esc(t[1])+'</div><div class="s">'+esc(t[2])+'</div></div>').join("");
  v.appendChild(stats);

  order.forEach(gname=>{
    const list=groups[gname].slice().sort((a,b)=>b.value-a.value);
    const s=document.createElement("div"); s.className="sec";
    s.innerHTML='<div class="sech"><h2 style="font-size:14px">'+esc(gname)+'</h2><span class="sub">'+list.length+' reactive</span></div>';
    const card=document.createElement("div"); card.className="card"; card.style.padding="14px";
    const bars=document.createElement("div"); bars.className="bars";
    bars.innerHTML=list.map(p=>{
      const b=bandOf(p.value);
      return '<div class="bar-row"><div class="bar-nm" title="'+esc(p.name)+'">'+esc(p.name)+'</div>'+
      '<div class="bar-tr"><div class="bar-fl" style="width:'+(p.value/mx*100)+'%;background:'+BC[b]+'"></div></div>'+
      '<div class="bar-vl num" style="color:'+BC[b]+'">'+nf(p.value,2)+'</div></div>';
    }).join("");
    card.appendChild(bars); s.appendChild(card); v.appendChild(s);
  });

  const lg=document.createElement("div"); lg.className="legend"; lg.style.marginBottom="14px";
  lg.innerHTML=["high","mid","low"].map(k=>'<span><i style="background:'+BC[k]+'"></i>'+bandLbl[k]+'</span>').join("")+
    '<span>All values in '+esc(f.unit||"µg/mL")+' · below 5 = negative ('+(f.negativeCount||0)+' antigens)</span>';
  v.appendChild(lg);

  const guide=document.createElement("div"); guide.className="note";
  guide.innerHTML='<b>What the pattern shows.</b> The reactivity is concentrated in dairy (β-lactoglobulin '+
    'highest of all at 28.4), egg (white 23.8, yolk 16.6) and cashew (22.1). Everything else sits in the low band. '+
    'A pragmatic approach is to remove the three top groups — cow-milk dairy, egg and cashew — for 4 to 6 weeks, '+
    'keep a symptom diary, then reintroduce one group at a time over a week each. Note that camel, goat and buffalo '+
    'milk were all negative, as were every fish, meat, wheat and gluten antigen — so this does not call for a broad '+
    'elimination diet. Discuss with a dietitian before removing whole food groups, especially with fatty liver and '+
    'lipid targets in play.';
  v.appendChild(guide);
}

 {k:"lab",n:"Lab result"},{k:"vital",n:"Vital / BP"},{k:"med",n:"Medication"},

        '<div class="fld"><label>Note</label><input name="note" placeholder="fasting, repeat sample…"></div>';
    }
    if(type==="vital"){
      return '<div class="frow"><div class="fld"><label>Date</label><input name="date" type="date" value="'+t+'" required></div>'+
        '<div class="fld"><label>Time</label><input name="time" type="time"></div></div>'+
        '<div class="frow"><div class="fld"><label>Systolic (mmHg)</label><input name="systolic" type="number" inputmode="numeric" placeholder="130"></div>'+
        '<div class="fld"><label>Diastolic (mmHg)</label><input name="diastolic" type="number" inputmode="numeric" placeholder="80"></div>'+
        '<div class="fld"><label>Pulse (bpm)</label><input name="pulse" type="number" inputmode="numeric"></div></div>'+
        '<div class="frow"><div class="fld"><label>Weight (kg)</label><input name="weight" type="number" step="any" inputmode="decimal"></div>'+

        '<div class="frow"><div class="fld"><label>Waist (cm)</label><input name="waist" type="number" step="any"></div>'+
        '<div class="fld"><label>Home glucose (mg/dL)</label><input name="glucose" type="number" step="any"></div></div>'+
        '<div class="fld"><label>Note</label><input name="note" placeholder="woke up, after exercise…"></div>'+
        '<div class="fld"><label><input type="checkbox" name="medTaken" style="width:auto;height:auto;margin-right:8px;vertical-align:-2px">Medication taken before this reading</label></div>';
    }
    if(type==="med"){
      return '<div class="frow"><div class="fld"><label>Brand name</label><input name="name" required placeholder="brand name"></div>'+
        '<div class="fld"><label>Generic name</label><input name="generic" placeholder="generic name"></div></div>'+
        '<div class="frow"><div class="fld"><label>Class</label><input name="cls" list="clsList" placeholder="Antihypertensive"></div>'+
        '<div class="fld"><label>Dose</label><input name="dose" placeholder="40 / 5 mg"></div>'+
        '<div class="fld"><label>Frequency</label><input name="freq" placeholder="Once daily, morning"></div></div>'+
        '<div class="frow"><div class="fld"><label>Start date</label><input name="start" type="date"></div>'+
        '<div class="fld"><label>End date <span class="muted">(blank = ongoing)</span></label><input name="end" type="date"></div>'+
        '<div class="fld"><label>Status</label><select name="status"><option value="active">active</option>'+
          '<option value="past">past</option><option value="stopped">stopped</option><option value="unknown">unknown</option></select></div></div>'+
        '<div class="fld"><label>Prescriber</label><input name="prescriber"></div>'+
        '<div class="fld"><label>Note</label><textarea name="note"></textarea></div>';
    }
    if(type==="cond"){
      return '<div class="fld"><label>Condition / issue</label><input name="name" required placeholder="e.g. Obstructive sleep apnoea"></div>'+
        '<div class="frow"><div class="fld"><label>Category</label><input name="category" list="condCatList" placeholder="Cardiovascular"></div>'+
        '<div class="fld"><label>Severity</label><select name="severity"><option value="mild">mild</option>'+
          '<option value="moderate" selected>moderate</option><option value="severe">severe</option></select></div>'+
        '<div class="fld"><label>Status</label><select name="status"><option value="active">active</option>'+
          '<option value="monitoring">monitoring</option><option value="controlled">controlled</option>'+
          '<option value="resolved">resolved</option></select></div></div>'+
        '<div class="frow"><div class="fld"><label>Onset date</label><input name="onset" type="date" required></div>'+
        '<div class="fld"><label>Resolved date <span class="muted">(if applicable)</span></label><input name="resolved" type="date"></div></div>'+
        '<div class="fld"><label>Notes</label><textarea name="note" placeholder="Findings, context, what triggered it…"></textarea></div>';
    }
    return '<div class="frow"><div class="fld"><label>Date</label><input name="date" type="date" value="'+t+'" required></div>'+
      '<div class="fld"><label>Type</label><select name="type"><option>Ultrasound</option><option>Pathology</option>'+
        '<option>Screening</option><option>Cardiac</option><option>Imaging</option><option>Procedure</option>'+
        '<option>Consultation</option><option>Record</option><option>Immunology</option></select></div></div>'+
      '<div class="fld"><label>Title</label><input name="title" required placeholder="Ultrasound, abdomen and pelvis"></div>'+
      '<div class="fld"><label>Provider / doctor</label><input name="provider"></div>'+
      '<div class="fld"><label>Findings</label><textarea name="findings"></textarea></div>'+
      '<div class="fld"><label>Impression</label><textarea name="impression"></textarea></div>';
  }

    body.innerHTML='<div class="seg">'+ADD_TYPES.map(t=>'<button data-t="'+t.k+'"'+(type===t.k?' class="on"':'')+'>'+t.n+'</button>').join("")+'</div>'+
      '<form id="addForm">'+fields()+'</form>'+
      '<datalist id="clsList">'+Object.keys(CLSCOL).map(k=>'<option>'+k+'</option>').join("")+'</datalist>'+
      '<datalist id="catList">'+Array.from(new Set(Object.values(S.data.testCatalog||{}).map(c=>c.category))).map(c=>'<option>'+esc(c)+'</option>').join("")+'</datalist>'+
      '<datalist id="condCatList">'+Array.from(new Set((S.data.conditions||[]).map(c=>c.category))).map(c=>'<option>'+esc(c)+'</option>').join("")+'</datalist>';
    $$(".seg button",body).forEach(b=>b.addEventListener("click",()=>{type=b.dataset.t; build();}));
    const sel=body.querySelector('select[name="test"]');
    if(sel){
      const uSel=body.querySelector('select[name="unit"]');
      const vIn=body.querySelector('input[name="value"]');
      const hint=$("#convHint",body);
      const ntU=body.querySelector('input[name="ntUnit"]');
      function fillUnits(){
        const tid=sel.value;
        const ch=unitChoices(tid, tid==="__new"&&ntU?ntU.value:"");
        uSel.innerHTML=ch.map((u,i)=>'<option value="'+u[1]+'"'+(i?'':' selected')+'>'+esc(u[0])+'</option>').join("");
        showConv();
      }
      function showConv(){
        const tid=sel.value, c=(S.data.testCatalog||{})[tid];
        const f=+uSel.value, raw=parseFloat(vIn.value);
        if(!c){ hint.textContent=""; return; }
        if(f===1||isNaN(f)){
          hint.textContent="Stored as "+(c.unit||"")+" \u2014 the unit used by "+refLabName()+".";
          return;
        }
        const dec=c.decimals!=null?c.decimals:2;
        hint.innerHTML=isNaN(raw)
          ? 'Will be converted to <b>'+esc(c.unit||"")+'</b> before it is stored.'
          : 'Converted: <b>'+nf(raw,4)+' '+esc(uSel.options[uSel.selectedIndex].textContent)+
            '</b> \u2192 <b>'+nf(+(raw*f).toFixed(dec),dec)+' '+esc(c.unit||"")+'</b> (original kept in the record)';
      }
      sel.addEventListener("change",()=>{ $("#newTest",body).style.display = sel.value==="__new"?"block":"none"; fillUnits(); });
      uSel.addEventListener("change",showConv);
      vIn.addEventListener("input",showConv);
      if(ntU) ntU.addEventListener("input",fillUnits);
      fillUnits();
    }
  }
  build();
  const foot=document.createElement("div"); foot.style.display="flex"; foot.style.gap="8px";
  foot.innerHTML='<button class="btn" id="aCancel">Cancel</button><button class="btn pri" id="aSave">Save record</button>';
  showModal("Add a record","Saved into this browser immediately — use Save to write the JSON file",body,foot);
  $("#aCancel").addEventListener("click",closeModal);
  $("#aSave").addEventListener("click",()=>{
    const f=$("#addForm"), g=n=>{ const el=f.elements[n]; return el?(el.type==="checkbox"?el.checked:el.value.trim()):""; };
    const num=n=>{ const s=g(n); return s===""?null:+s; };
